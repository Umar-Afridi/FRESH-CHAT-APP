<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Multi-Color Prismatic Gradients for 💎 (All Colors Fire Effect) -->
    
    <!-- Top Facets -->
    <linearGradient id="gTFL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccffff"/>
      <stop offset="100%" stop-color="#33bbff"/>
    </linearGradient>
    <linearGradient id="gTML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff99cc"/> <!-- Pink Fire -->
    </linearGradient>
    <linearGradient id="gTC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#80dfff"/> <!-- Ice Blue -->
    </linearGradient>
    <linearGradient id="gTMR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ffff"/>
      <stop offset="100%" stop-color="#b366ff"/> <!-- Purple Fire -->
    </linearGradient>
    <linearGradient id="gTFR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33bbff"/>
      <stop offset="100%" stop-color="#ff66b3"/> <!-- Magenta/Pink -->
    </linearGradient>

    <!-- Bottom Facets -->
    <linearGradient id="gBFL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>
    <linearGradient id="gBML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff66b3"/> <!-- Pink Base -->
      <stop offset="100%" stop-color="#005580"/>
    </linearGradient>
    <linearGradient id="gBMR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9933ff"/> <!-- Purple Base -->
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="gBFR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ccff"/>
      <stop offset="100%" stop-color="#1a0033"/> <!-- Deep Shadow -->
    </linearGradient>

    <!-- Super Bright Chamak (Shine) Gradient for Inner Sparkle -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Drop Shadow for popping out on any transparent/GIF background -->
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00aaff" flood-opacity="0.5"/>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Blur for Internal Glass Edge Glows -->
    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="heavy-blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Clip Path exactly matching the Diamond outline for the running internal shine -->
    <clipPath id="diamondClip">
      <polygon points="170,110 330,110 460,220 250,460 40,220" />
    </clipPath>
  </defs>

  <!-- Static Group (NO Float Animation per user request) -->
  <g filter="url(#drop-shadow)">
    
    <!-- Main Diamond Facets -->
    <g stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
      <!-- Top Crown Facets -->
      <polygon points="170,110 40,220 150,220" fill="url(#gTFL)" />
      <polygon points="170,110 150,220 250,220" fill="url(#gTML)" />
      <polygon points="170,110 330,110 250,220" fill="url(#gTC)" />
      <polygon points="330,110 250,220 350,220" fill="url(#gTMR)" />
      <polygon points="330,110 350,220 460,220" fill="url(#gTFR)" />
      
      <!-- Bottom Pavilion Facets -->
      <polygon points="40,220 150,220 250,460" fill="url(#gBFL)" />
      <polygon points="150,220 250,220 250,460" fill="url(#gBML)" />
      <polygon points="250,220 350,220 250,460" fill="url(#gBMR)" />
      <polygon points="350,220 460,220 250,460" fill="url(#gBFR)" />
    </g>

    <!-- Inner Edge Glows (Creates the ultra-realistic 3D glass look) -->
    <g fill="none" stroke="#ffffff" stroke-width="3" filter="url(#soft-blur)" opacity="0.6">
      <polygon points="170,110 40,220 150,220" />
      <polygon points="170,110 150,220 250,220" />
      <polygon points="170,110 330,110 250,220" />
      <polygon points="330,110 250,220 350,220" />
      <polygon points="330,110 350,220 460,220" />
      <polygon points="40,220 150,220 250,460" />
      <polygon points="350,220 460,220 250,460" />
    </g>

    <!-- Specular Highlight Overlay (Intense Left side light reflection) -->
    <polygon points="170,110 40,220 150,220" fill="#ffffff" opacity="0.4" filter="url(#soft-blur)" />
    <polygon points="40,220 150,220 250,460" fill="#ffffff" opacity="0.15" filter="url(#heavy-blur)" />

    <!-- Top Flat Highlight -->
    <polygon points="170,110 330,110 250,130" fill="#ffffff" opacity="0.7" filter="url(#soft-blur)" />

    <!-- The Running Chamak Patti (Animated Inner Shine Effect) -->
    <g clip-path="url(#diamondClip)">
      <!-- Main wide shine sweeping across -->
      <rect x="-300" y="0" width="80" height="500" fill="url(#shineGrad)" transform="skewX(-35)">
        <animate attributeName="x" from="-350" to="700" dur="2.5s" repeatCount="indefinite" />
      </rect>
      <!-- Secondary bright thin shine following behind for extra sparkle -->
      <rect x="-180" y="0" width="15" height="500" fill="url(#shineGrad)" transform="skewX(-35)">
        <animate attributeName="x" from="-230" to="820" dur="2.5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Glowing & Twinkling Realistic Stars / Sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    
    <!-- Top Left Sparkle -->
    <g transform="translate(150, 90)">
      <path d="M 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Q 15 15 15 0 Z">
        <animateTransform attributeName="transform" type="scale" values="0.6; 1.4; 0.6" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite" />
      </path>
      <circle cx="15" cy="15" r="2" fill="#fff" />
    </g>
    
    <!-- Top Right Sparkle -->
    <g transform="translate(325, 95)">
      <path d="M 10 0 Q 10 10 20 10 Q 10 10 10 20 Q 10 10 0 10 Q 10 10 10 0 Z" fill="#ffccff">
        <animateTransform attributeName="transform" type="scale" values="0.5; 1.2; 0.5" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Far Left Sparkle -->
    <g transform="translate(15, 205)">
      <path d="M 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Q 15 15 15 0 Z" fill="#ccffff">
        <animateTransform attributeName="transform" type="scale" values="0.7; 1.5; 0.7" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.8s" repeatCount="indefinite" />
      </path>
      <circle cx="15" cy="15" r="2" fill="#fff" />
    </g>
    
    <!-- Far Right Sparkle -->
    <g transform="translate(445, 205)">
      <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z" fill="#e6ccff">
        <animateTransform attributeName="transform" type="scale" values="0.6; 1.3; 0.6" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 1; 0.1" dur="2.2s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Bottom Point Sparkle -->
    <g transform="translate(235, 450)">
      <path d="M 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Q 15 15 15 0 Z">
        <animateTransform attributeName="transform" type="scale" values="0.4; 1.3; 0.4" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="3s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>