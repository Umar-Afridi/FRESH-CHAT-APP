<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- CSS Animation for Blinking Shine -->
    <style>
      .star-blink-1 {
        animation: twinkle 1.5s infinite alternate ease-in-out;
        transform-origin: 65px 65px;
      }
      .star-blink-2 {
        animation: twinkle 2s infinite alternate-reverse ease-in-out;
        transform-origin: 200px 90px;
      }
      .pencil-pulse {
        animation: pulseShine 1.5s infinite alternate ease-in-out;
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes pulseShine {
        0% { opacity: 0.2; }
        100% { opacity: 0.85; }
      }
    </style>

    <!-- Glow Filter to make sparkles really SHINE -->
    <filter id="realGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" /> <!-- Double blur for extra brightness -->
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Gradient for Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD175" />
      <stop offset="45%" stop-color="#FF7A63" />
      <stop offset="100%" stop-color="#FF5171" />
    </linearGradient>

    <!-- Glossy Overlay Gradient for Main App Glass -->
    <linearGradient id="iconGloss" x1="0%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Clipboard Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF2AA" />
    </linearGradient>

    <!-- Pencil Top Face Gradient -->
    <linearGradient id="pencilTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE48F" />
      <stop offset="100%" stop-color="#FFD05B" />
    </linearGradient>

    <!-- Soft Drop Shadow for Clipboard -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D13A49" flood-opacity="0.25" />
    </filter>

    <!-- Stronger Drop Shadow for Pencil -->
    <filter id="pencilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="5" flood-color="#A52C16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main App Icon Rounded Square -->
  <rect x="24" y="24" width="208" height="208" rx="55" fill="url(#bgGrad)" />
  
  <!-- Main Glass Glossy Overlay -->
  <rect x="24" y="24" width="208" height="208" rx="55" fill="url(#iconGloss)" />

  <!-- Clipboard Group -->
  <g filter="url(#softShadow)">
    <rect x="73" y="65" width="110" height="130" rx="16" fill="url(#paperGrad)" />
    <!-- Top Clip Hardware -->
    <rect x="108" y="52" width="40" height="24" rx="8" fill="#FDBF61" />
    <!-- Clip Highlight (Shine) -->
    <rect x="112" y="55" width="32" height="4" rx="2" fill="#FFFFFF" class="pencil-pulse" />
    <rect x="116" y="46" width="24" height="10" rx="4" fill="#FDBF61" />
  </g>

  <!-- Checkmark Graphic -->
  <g fill="none" stroke="#F6B15B" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="130" r="34" stroke-width="12" />
    <path d="M 112 130 L 124 142 L 150 116" stroke-width="12" />
  </g>

  <!-- Pencil Group -->
  <g transform="translate(145, 140) rotate(55)" filter="url(#pencilShadow)">
    <path d="M 0,-40 L -22,0 L 22,0 Z" fill="#FDD7B2" />
    <path d="M 0,-40 L -8,-25 L 8,-25 Z" fill="#5F4133" stroke="#5F4133" stroke-width="1" stroke-linejoin="round"/>
    <path d="M -22,0 L 0,0 L 0,85 L -22,85 Z" fill="#F8A532" />
    <path d="M 0,0 L 22,0 L 22,85 L 0,85 Z" fill="url(#pencilTop)" />
    
    <!-- Animated Glowing Pencil Highlight -->
    <path d="M 12,0 L 18,0 L 18,83 L 12,83 Z" fill="#FFFFFF" class="pencil-pulse" />
    
    <path d="M -22,85 C -10,92 10,92 22,85 L 22,80 L -22,80 Z" fill="#F8A532" opacity="0.8"/>
  </g>

  <!-- ANIMATED & GLOWING SPARKLES -->
  
  <!-- Sparkle 1 (Top Left) -->
  <path class="star-blink-1" filter="url(#realGlow)" d="M 55 65 Q 65 65 65 55 Q 65 65 75 65 Q 65 65 65 75 Q 65 65 55 65 Z" fill="#FFFFFF" />

  <!-- Sparkle 2 (Right side near pencil) -->
  <path class="star-blink-2" filter="url(#realGlow)" d="M 195 90 Q 200 90 200 85 Q 200 90 205 90 Q 200 90 200 95 Q 200 90 195 90 Z" fill="#FFFFFF" />

  <!-- Outer Glass Border -->
  <rect x="25" y="25" width="206" height="206" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />

</svg>