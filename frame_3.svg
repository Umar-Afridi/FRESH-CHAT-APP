<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <!-- Thick Segmented Rotating Base -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gold3)" stroke-width="8" stroke-dasharray="40 15" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- Clean Gold Border -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#gold3)" stroke-width="4" filter="url(#glow3)"/>
  <!-- Gold Sparkles -->
  <circle cx="25" cy="100" r="3" fill="#FDE047" filter="url(#glow3)"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="175" cy="100" r="3" fill="#FDE047" filter="url(#glow3)"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
</svg>