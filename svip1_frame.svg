<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Crisp 3D Shadow for Premium Depth -->
    <filter id="crisp-shadow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#001A1A" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Text Shadow -->
    <filter id="text-shadow-1">
      <feDropShadow dx="0" dy="3" stdDeviation="1" flood-color="#003333" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1DE9B6" flood-opacity="0.6"/>
    </filter>

    <!-- ================= PREMIUM SVIP 1 GRADIENTS ================= -->
    <!-- Brilliant Teal / Firozi -->
    <linearGradient id="teal-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7FFEB"/>
      <stop offset="30%" stop-color="#1DE9B6"/>
      <stop offset="70%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>

    <!-- Deep Teal for Accents -->
    <linearGradient id="teal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00BFA5"/>
      <stop offset="60%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#00261C"/>
    </linearGradient>

    <!-- Sleek VIP Silver / Platinum -->
    <linearGradient id="silver-vip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CFD8DC"/>
      <stop offset="80%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>

    <!-- Soft Gold Accents (Replacing the weird yellow stripes) -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>

    <linearGradient id="text-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#A7FFEB"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>

    <mask id="frame-mask-1">
      <rect x="0" y="0" width="500" height="500" fill="#FFFFFF"/>
    </mask>

    <!-- Sleek Side Wings (Modern and Curved) -->
    <g id="sleek-wing">
      <!-- Outer Silver Arch -->
      <path d="M 130,360 C 50,290 50,150 130,80 C 80,180 80,270 145,330 Z" fill="url(#silver-vip)" filter="url(#crisp-shadow-1)"/>
      <!-- Inner Glowing Teal Line -->
      <path d="M 135,320 C 70,250 70,170 135,100 C 95,180 95,250 145,295 Z" fill="url(#teal-bright)"/>
      <!-- Gold Accent Wing at the bottom -->
      <path d="M 120,330 C 70,300 60,240 80,210 C 70,250 90,290 135,310 Z" fill="url(#gold-light)" filter="url(#crisp-shadow-1)"/>
    </g>

    <g id="sparkle-1">
      <path d="M0,-10 Q0,0 10,0 Q0,0 0,10 Q0,0 -10,0 Q0,0 0,-10 Z" fill="#FFFFFF" filter="url(#glow-1)"/>
    </g>
  </defs>

  <!-- BACKGROUND IS COMPLETELY ERASED / TRANSPARENT -->

  <!-- ================= SMOOTH MAIN RINGS ================= -->
  <g filter="url(#crisp-shadow-1)">
    <!-- Main Thick Silver Ring -->
    <circle cx="250" cy="250" r="162" fill="none" stroke="url(#silver-vip)" stroke-width="18" />
    
    <!-- Inner Glowing Teal Core -->
    <circle cx="250" cy="250" r="154" fill="none" stroke="url(#teal-bright)" stroke-width="8" />
    
    <!-- Outer Gold Fine Line -->
    <circle cx="250" cy="250" r="172" fill="none" stroke="url(#gold-light)" stroke-width="3" opacity="0.8" />
  </g>

  <!-- ================= SLEEK WINGS (Replacing the bad stripes) ================= -->
  <!-- Clean, metallic wings wrapping around the frame -->
  <g>
    <use href="#sleek-wing" x="0" y="0"/>
    <use href="#sleek-wing" x="0" y="0" transform="translate(500, 0) scale(-1, 1)"/>
  </g>

  <!-- ================= TOP CROWN (Premium 3D Diamond) ================= -->
  <!-- Nested shapes ki jagah ek asli chamakta hua diamond aur crown -->
  <g filter="url(#crisp-shadow-1)">
    <!-- Silver Base Arch -->
    <path d="M 200,60 Q 250,25 300,60 Q 250,45 200,60 Z" fill="url(#silver-vip)"/>
    <path d="M 215,60 Q 250,35 285,60 Q 250,50 215,60 Z" fill="url(#gold-light)"/>
    
    <!-- 3D Teal Diamond Gem -->
    <polygon points="250,15 275,45 250,75 225,45" fill="url(#teal-dark)"/>
    <polygon points="250,15 250,75 225,45" fill="url(#teal-bright)"/>
    <polygon points="250,22 268,45 250,68 232,45" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Top Glowing Dot -->
    <circle cx="250" cy="15" r="4" fill="#FFFFFF" filter="url(#glow-1)">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= ELEGANT BOTTOM BANNER ================= -->
  <!-- Simple, curved metallic ribbon. No boxy/weird shapes. -->
  <g filter="url(#crisp-shadow-1)">
    <!-- Back Ribbon Fold (Shadow side) -->
    <path d="M 110,410 L 130,445 L 160,430 Z" fill="url(#teal-dark)"/>
    <path d="M 390,410 L 370,445 L 340,430 Z" fill="url(#teal-dark)"/>

    <!-- Main VIP Banner -->
    <path d="M 120,390 C 180,385 220,395 250,405 C 280,395 320,385 380,390 L 395,435 C 320,440 280,450 250,460 C 220,450 180,440 105,435 Z" fill="url(#teal-bright)"/>
    
    <!-- Silver Trim -->
    <path d="M 120,390 C 180,385 220,395 250,405 C 280,395 320,385 380,390 L 395,435 C 320,440 280,450 250,460 C 220,450 180,440 105,435 Z" fill="none" stroke="url(#silver-vip)" stroke-width="4"/>
    
    <!-- Banner Edge Clasps -->
    <path d="M 120,380 L 140,400 L 125,450 L 100,420 Z" fill="url(#silver-vip)"/>
    <path d="M 380,380 L 360,400 L 375,450 L 400,420 Z" fill="url(#silver-vip)"/>

    <!-- Bottom Drop Diamond (Matching the top) -->
    <polygon points="250,460 240,475 250,495 260,475" fill="url(#teal-bright)"/>
    <polygon points="250,460 250,495 260,475" fill="url(#teal-dark)"/>
  </g>

  <!-- ================= 3D EMBOSSED TEXT ================= -->
  <text x="250" y="432" dominant-baseline="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="28" fill="url(#text-grad-1)" text-anchor="middle" letter-spacing="3" filter="url(#text-shadow-1)">SVIP 1</text>

  <!-- ================= SPARKLING STARS ================= -->
  <use href="#sparkle-1" x="90" y="120" transform="scale(0.8)">
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.5s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle-1" x="420" y="280" transform="scale(0.9)">
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2s" repeatCount="indefinite"/>
  </use>

  <!-- ================= SMOOTH VIP SHINE SWEEP ================= -->
  <g mask="url(#frame-mask-1)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-200 -100; 700 300" dur="3s" repeatCount="indefinite" />
      <linearGradient id="shine-sweep-1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="-400" width="30" height="1200" fill="url(#shine-sweep-1)" transform="rotate(35)" />
      <rect x="45" y="-400" width="60" height="1200" fill="url(#shine-sweep-1)" transform="rotate(35)" opacity="0.3"/>
    </g>
  </g>
</svg>