<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="sv3-gdBase" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3600"/><stop offset="50%" stop-color="#cca814"/><stop offset="100%" stop-color="#261b01"/>
    </linearGradient>
    <linearGradient id="sv3-gdHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#ffd700"/><stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="sv3-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f5deb3"/>
    </linearGradient>
    <filter id="sv3-sh"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.85"/></filter>
    <filter id="sv3-gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="sv3-emb">
      <ellipse cx="0" cy="0" rx="3" ry="14" fill="#ffd700" filter="url(#sv3-gl)" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#fff"/>
    </g>
  </defs>
  <style>
    .sv3-wL { transform-origin: 300px 160px; animation: sv3wL 3s ease-in-out infinite alternate; }
    .sv3-wR { transform-origin: 300px 160px; animation: sv3wR 3s ease-in-out infinite alternate; }
    @keyframes sv3wL { 0% { transform: rotate(0deg); } 100% { transform: rotate(-7deg); } }
    @keyframes sv3wR { 0% { transform: rotate(0deg); } 100% { transform: rotate(7deg); } }
    @keyframes sv3flyL { 0%{transform:translate(120px,600px) scale(0);opacity:0;} 50%{opacity:1;transform:translate(170px,320px) scale(1.2) rotate(30deg);} 100%{transform:translate(230px,80px) scale(0) rotate(50deg);opacity:0;} }
    @keyframes sv3flyR { 0%{transform:translate(480px,600px) scale(0);opacity:0;} 50%{opacity:1;transform:translate(430px,320px) scale(1.2) rotate(-30deg);} 100%{transform:translate(370px,80px) scale(0) rotate(-50deg);opacity:0;} }
    .sv3-el1 { animation: sv3flyL 2.5s infinite ease-in; }
    .sv3-er1 { animation: sv3flyR 2.7s infinite ease-in 0.5s; }
    .sv3-el2 { animation: sv3flyL 2.2s infinite ease-in 1.2s; }
    .sv3-er2 { animation: sv3flyR 2.4s infinite ease-in 1.7s; }
  </style>

  <!-- Angel Wings with Wind -->
  <g filter="url(#sv3-sh)">
    <path class="sv3-wL" d="M300,160 Q120,100 80,40 Q150,70 230,140 Z" fill="url(#sv3-wing)"/>
    <path class="sv3-wR" d="M300,160 Q480,100 520,40 Q450,70 370,140 Z" fill="url(#sv3-wing)"/>
  </g>

  <!-- Thick Gold Frame -->
  <circle cx="300" cy="350" r="200" fill="none" stroke="#261b01" stroke-width="30" filter="url(#sv3-sh)"/>
  <circle cx="300" cy="350" r="200" fill="none" stroke="url(#sv3-gdHigh)" stroke-width="20"/>
  <circle cx="300" cy="350" r="180" fill="none" stroke="url(#sv3-gdBase)" stroke-width="6" stroke-dasharray="10 5"/>

  <!-- Royal Crown -->
  <path d="M230,140 L250,60 L300,110 L350,60 L370,140 Z" fill="url(#sv3-gdHigh)" filter="url(#sv3-sh)"/>
  <circle cx="300" cy="110" r="10" fill="#ffffff" filter="url(#sv3-gl)"/>

  <!-- Nameplate -->
  <g filter="url(#sv3-sh)">
    <path d="M150,520 Q300,500 450,520 L460,570 Q300,590 140,570 Z" fill="#120c00" stroke="url(#sv3-gdHigh)" stroke-width="8"/>
  </g>

  <!-- Golden Sparks over frame -->
  <g opacity="0.9">
    <use href="#sv3-emb" class="sv3-el1"/><use href="#sv3-emb" class="sv3-er1"/>
    <use href="#sv3-emb" class="sv3-el2"/><use href="#sv3-emb" class="sv3-er2"/>
  </g>

  <text x="300" y="565" font-family="'Trebuchet MS', sans-serif" font-size="38" font-weight="900" fill="url(#sv3-gdHigh)" text-anchor="middle" letter-spacing="4">SVIP 3</text>
</svg>