
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Soft Melancholic Pink to White) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcfdd" />
      <stop offset="60%" stop-color="#ffecf1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Broken Heart Gradient -->
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5" />
      <stop offset="100%" stop-color="#ff7ea0" />
    </linearGradient>

    <!-- Drop Shadow for the Heart Halves to give a 3D cracking effect -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ff7ea0" flood-opacity="0.3"/>
    </filter>
    
    <!-- Inner Glow from the Crack -->
    <radialGradient id="crackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffcfdd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="340" fill="url(#bgGradient)" rx="15" ry="15" />

  <!-- Soft Horizon/Floor Glow -->
  <ellipse cx="400" cy="270" rx="250" ry="20" fill="#ffffff" opacity="0.9" />

  <!-- ================= BACKGROUND CLOUDS (Drifting Animation) ================= -->
  
  <!-- Left Side Clouds -->
  <g opacity="0.6" fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" values="-15,0; 10,0; -15,0" dur="8s" repeatCount="indefinite" />
    <!-- Wispy Tail -->
    <path d="M -20 180 Q 40 180 60 150 Q 90 130 110 160 Q 140 150 160 180 Q 190 190 240 190 Q 200 210 150 210 L -20 210 Z" />
    <!-- Fluffy Parts -->
    <circle cx="80" cy="145" r="25" />
    <circle cx="125" cy="165" r="20" />
    <circle cx="170" cy="180" r="15" />
  </g>

  <!-- Right Side Clouds -->
  <g opacity="0.6" fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" values="15,0; -10,0; 15,0" dur="9s" repeatCount="indefinite" />
    <!-- Wispy Tail -->
    <path d="M 820 180 Q 760 180 740 150 Q 710 130 690 160 Q 660 150 640 180 Q 610 190 560 190 Q 600 210 650 210 L 820 210 Z" />
    <!-- Fluffy Parts -->
    <circle cx="720" cy="145" r="25" />
    <circle cx="675" cy="165" r="20" />
    <circle cx="630" cy="180" r="15" />
  </g>


  <!-- ================= CENTER BROKEN HEART ================= -->
  
  <g transform="translate(400, 140) scale(1.6)">
    
    <!-- Glowing light inside the crack that pulses when the heart breaks open -->
    <circle cx="0" cy="40" r="40" fill="url(#crackGlow)">
      <animate attributeName="opacity" values="0; 1; 0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="r" values="20; 55; 20" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- LEFT HALF OF THE HEART -->
    <g filter="url(#dropShadow)">
      <!-- Animates moving left and tilting downward -->
      <animateTransform attributeName="transform" type="translate" values="0,0; -10, 5; 0,0" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0; -8; 0" dur="4s" repeatCount="indefinite" additive="sum" />
      
      <path d="M 0 -15 C -30 -50 -75 -35 -75 5 C -75 45 0 95 0 95 L -2 70 L -14 45 L 6 25 L -8 5 Z" fill="url(#heartGradient)" />
    </g>

    <!-- RIGHT HALF OF THE HEART -->
    <g filter="url(#dropShadow)">
      <!-- Animates moving right and tilting downward -->
      <animateTransform attributeName="transform" type="translate" values="0,0; 10, 5; 0,0" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0; 8; 0" dur="4s" repeatCount="indefinite" additive="sum" />
      
      <path d="M 0 -15 L -8 5 L 6 25 L -14 45 L -2 70 L 0 95 C 0 95 75 45 75 5 C 75 -35 30 -50 0 -15 Z" fill="url(#heartGradient)" />
    </g>

  </g>

  <!-- ================= FALLING TEARDROPS ================= -->
  
  <g>
    <!-- Tear 1 -->
    <path d="M 380 200 Q 385 215 385 220 Q 385 225 380 225 Q 375 225 375 220 Q 375 215 380 200 Z" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0.9; 0" dur="4s" begin="1s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,50" dur="4s" begin="1s" repeatCount="indefinite" />
    </path>
    
    <!-- Tear 2 -->
    <path d="M 420 180 Q 425 195 425 200 Q 425 205 420 205 Q 415 205 415 200 Q 415 195 420 180 Z" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0.9; 0" dur="4s" begin="2.5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,60" dur="4s" begin="2.5s" repeatCount="indefinite" />
    </path>
  </g>

</svg>