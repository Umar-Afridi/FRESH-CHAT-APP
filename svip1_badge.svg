<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <!-- Premium Silver Gradient for Borders and Text -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cfcfcf"/>
      <stop offset="50%" stop-color="#9e9e9e"/>
      <stop offset="70%" stop-color="#cfcfcf"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Horizontal Silver for the 3D text effect -->
    <linearGradient id="silver-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfcfcf"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Teal/Emerald Gradient for the Badge Background -->
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bfa5"/>
      <stop offset="50%" stop-color="#00897b"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>

    <!-- Clip Path to keep the shine animation exactly inside the badge -->
    <clipPath id="badge-clip">
      <rect x="70" y="35" width="400" height="80" rx="40"/>
    </clipPath>

    <!-- Glow Filter for Text & Crown Jewels -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- اس پورے گروپ کو کینوس کے بالکل درمیان (Center) میں سیٹ کیا گیا ہے -->
  <g transform="translate(58, 212)">
    
    <!-- ========================================== -->
    <!-- 1. MAIN PILL / BADGE BACKGROUND -->
    <!-- ========================================== -->
    
    <!-- Outer Silver Border -->
    <rect x="70" y="35" width="400" height="80" rx="40" fill="url(#silver-grad)"/>
    
    <!-- Inner Teal Background -->
    <rect x="73" y="38" width="394" height="74" rx="37" fill="url(#teal-grad)"/>
    
    <!-- Inner subtle 3D border line -->
    <rect x="75" y="40" width="390" height="70" rx="35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>


    <!-- ========================================== -->
    <!-- 2. SHINE ANIMATION (Inside the Pill) -->
    <!-- ========================================== -->
    
    <g clip-path="url(#badge-clip)">
      <!-- Diagonal Light Beam Sweeping Across -->
      <polygon points="0,-20 40,-20 90,120 50,120" fill="#ffffff" opacity="0.4">
        <animateTransform 
          attributeName="transform" 
          type="translate" 
          from="-150 0" 
          to="600 0" 
          dur="3s" 
          repeatCount="indefinite" />
      </polygon>
      
      <!-- Secondary Thinner Light Beam -->
      <polygon points="-20,-20 -10,-20 40,120 30,120" fill="#ffffff" opacity="0.6">
        <animateTransform 
          attributeName="transform" 
          type="translate" 
          from="-150 0" 
          to="600 0" 
          dur="3s" 
          repeatCount="indefinite" />
      </polygon>
    </g>


    <!-- ========================================== -->
    <!-- 3. SVIP 1 TEXT -->
    <!-- ========================================== -->
    
    <g transform="translate(260, 90)">
      <!-- Text Dark Shadow for Depth -->
      <text x="0" y="2" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#00332c" text-anchor="middle" letter-spacing="4">SVIP 1</text>
      
      <!-- Main Silver Text -->
      <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="url(#silver-text)" text-anchor="middle" letter-spacing="4">SVIP 1</text>
      
      <!-- Subtle Text Glow (Static) -->
      <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#glow)" opacity="0.4" text-anchor="middle" letter-spacing="4">SVIP 1</text>
    </g>


    <!-- ========================================== -->
    <!-- 4. SHIELD & CROWN (Left Side) -->
    <!-- ========================================== -->
    
    <g id="shield-group">
      
      <!-- Little Silver Wings on the Sides -->
      <path d="M 50 60 Q 35 45 20 45 Q 35 60 43 70 Z" fill="url(#silver-grad)"/>
      <path d="M 50 75 Q 30 65 15 65 Q 35 80 47 85 Z" fill="url(#silver-grad)"/>
      
      <path d="M 130 60 Q 145 45 160 45 Q 145 60 137 70 Z" fill="url(#silver-grad)"/>
      <path d="M 130 75 Q 150 65 165 65 Q 145 80 133 85 Z" fill="url(#silver-grad)"/>

      <!-- Main Shield Outer Silver Border -->
      <path d="M 45 35 L 135 35 L 142 80 Q 142 120 90 140 Q 38 120 38 80 Z" fill="url(#silver-grad)"/>
      
      <!-- Inner Teal Shield -->
      <path d="M 50 40 L 130 40 L 135 80 Q 135 115 90 133 Q 45 115 45 80 Z" fill="url(#teal-grad)"/>
      
      <!-- Inner Shield Silver Outline -->
      <path d="M 53 43 L 127 43 L 132 80 Q 132 110 90 126 Q 48 110 48 80 Z" fill="none" stroke="#ffffff" stroke-width="2"/>

      <!-- Crown Inside the Shield -->
      <!-- Crown Base -->
      <rect x="65" y="90" width="50" height="7" rx="2" fill="url(#silver-grad)"/>
      <rect x="67" y="100" width="46" height="3" rx="1" fill="url(#silver-grad)"/>
      
      <!-- Crown Points -->
      <path d="M 65 88 L 60 65 L 75 80 L 90 60 L 105 80 L 120 65 L 115 88 Z" fill="url(#silver-grad)"/>
      
      <!-- Crown Jewels (Dots) -->
      <circle cx="60" cy="62" r="3" fill="#ffffff"/>
      <circle cx="90" cy="57" r="4" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="120" cy="62" r="3" fill="#ffffff"/>

      <!-- Small diamond at the bottom point of shield -->
      <polygon points="90,118 95,123 90,128 85,123" fill="#ffffff"/>

      <!-- Static Shine Reflection on the Shield -->
      <path d="M 45 35 L 80 35 L 45 70 Z" fill="#ffffff" opacity="0.3"/>
    </g>

  </g>
</svg>