<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Dark Red to Maroon Gradient for Chat Bubble Base -->
    <linearGradient id="redBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990000"/>
      <stop offset="50%" stop-color="#590000"/>
      <stop offset="100%" stop-color="#2a0000"/>
    </linearGradient>

    <!-- Glowing Golden/Yellow Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffff99"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#cc7a00"/>
    </linearGradient>

    <!-- Realistic 3D Gold Gradient for Crown & Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="20%" stop-color="#ffbb00"/>
      <stop offset="50%" stop-color="#cc7700"/>
      <stop offset="80%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#804000"/>
    </linearGradient>

    <!-- Vibrant Red Gem/Diamond Gradient -->
    <linearGradient id="redGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Pop Effect -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="elementShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    
    <!-- Outer Glow for Sparkles and Neon Edges -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glowing Gold Filter for Borders -->
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkling Star Shape -->
    <g id="star">
      <path d="M0,-15 Q0,0 15,0 Q0,0 0,15 Q0,0 -15,0 Q0,0 0,-15 Z" fill="#ffffff" filter="url(#glowEffect)"/>
    </g>
  </defs>

  <style>
    /* BUBBLE IS FIXED - ONLY STARS BLINK TO GIVE A PREMIUM FEEL */
    .twinkle1 { animation: blink 2s infinite alternate ease-in-out; }
    .twinkle2 { animation: blink 2.5s infinite alternate ease-in-out 0.5s; }
    .twinkle3 { animation: blink 1.8s infinite alternate ease-in-out 1s; }
    .twinkle4 { animation: blink 3s infinite alternate ease-in-out 0.2s; }
    
    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- BACKGROUND IS NOW 100% TRANSPARENT (NO WHITE BOX) -->

  <!-- BACKGROUND SPARKLES (Animated but keep their position fixed) -->
  <g transform="translate(85, 120)">
    <use href="#star" class="twinkle1" transform="scale(0.8)"/>
  </g>
  <g transform="translate(415, 85)">
    <use href="#star" class="twinkle2" transform="scale(1)"/>
  </g>
  <g transform="translate(395, 275)">
    <use href="#star" class="twinkle3" transform="scale(0.9)"/>
  </g>
  <g transform="translate(140, 270)">
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" class="twinkle4" filter="url(#glowEffect)"/>
  </g>

  <!-- ========================================== -->
  <!-- MAIN CHAT BUBBLE (FIXED POSITION) -->
  <!-- ========================================== -->
  <g filter="url(#boxShadow)">
    <!-- Glowing Golden Outer Edge -->
    <rect x="116" y="96" width="268" height="138" rx="18" fill="none" stroke="url(#goldBorder)" stroke-width="6" filter="url(#glowGold)" opacity="0.8"/>
    
    <!-- Base Red Rectangle -->
    <rect x="120" y="100" width="260" height="130" rx="15" fill="url(#redBase)" stroke="url(#goldBorder)" stroke-width="3"/>
    
    <!-- Inner Glassy Highlight (Shine) -->
    <rect x="123" y="103" width="254" height="60" rx="12" fill="#ffffff" opacity="0.1"/>
    <rect x="122" y="102" width="256" height="126" rx="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- ========================================== -->
  <!-- EXTERNAL DECORATIONS -->
  <!-- ========================================== -->

  <!-- Bottom Left Golden Wing & Red Flame Inside -->
  <g transform="translate(120, 230)" filter="url(#elementShadow)">
    <!-- Gold Hook/Swoop -->
    <path d="M -10,-10 C -20,30 30,50 60,10 C 30,30 -5,20 5,-15 Z" fill="url(#goldGrad)"/>
    <path d="M -5,5 C 0,20 20,30 40,15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Red Flame Wing over the Gold -->
    <path d="M -15,-40 Q -30,0 5,15 Q -10,0 -5,-30 Z" fill="url(#redGem)"/>
    <!-- Inner bright line for fin -->
    <path d="M -10,-30 Q -15,-5 0,5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Bottom Right 3D Royal Crown (With Red Velvet Inside) -->
  <g transform="translate(365, 220) rotate(-8)" filter="url(#elementShadow)">
    
    <!-- Red Velvet Cushion inside the Crown -->
    <path d="M-25,-5 Q-15,-30 -5,-5 Q5,-30 15,-5 Q25,-30 35,-5 L30,20 L-20,20 Z" fill="#ff1a1a"/>
    <path d="M-20,0 Q-10,-20 0,0 Q10,-20 20,0 Q30,-20 30,0 L25,20 L-15,20 Z" fill="#990000"/>

    <!-- Gold Crown Base & Spikes -->
    <path d="M-30,-10 L-20,20 L30,20 L40,-10 L20,5 L5,-20 L-10,5 Z" fill="url(#goldGrad)"/>
    <!-- Crown 3D Depth Shade -->
    <path d="M-25,-5 L-20,20 L30,20 L35,-5 L20,10 L5,-10 L-10,10 Z" fill="#b36b00" opacity="0.6"/>
    
    <!-- Crown Bottom Rim -->
    <rect x="-22" y="18" width="54" height="6" rx="3" fill="url(#goldGrad)"/>
    <rect x="-22" y="18" width="54" height="2" fill="#ffffff" opacity="0.5"/>

    <!-- Jewels on the crown peaks (Glowing) -->
    <circle cx="-30" cy="-10" r="3.5" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="5" cy="-20" r="4" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="40" cy="-10" r="3.5" fill="#ffffff" filter="url(#glowEffect)"/>
    
    <!-- Red Jewels on the Crown Rim -->
    <circle cx="-10" cy="21" r="1.5" fill="#ff0000"/>
    <circle cx="5" cy="21" r="2" fill="#ff0000"/>
    <circle cx="20" cy="21" r="1.5" fill="#ff0000"/>
  </g>

  <!-- ========================================== -->
  <!-- TEXT (HELLO) -->
  <!-- ========================================== -->
  <!-- Fixed Text, properly centered with Drop Shadow -->
  <text x="250" y="180" font-family="'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#elementShadow)">Hello</text>

  <!-- Extra small glow dots around the text -->
  <circle cx="340" cy="180" r="2" fill="#ffffff" class="twinkle3" filter="url(#glowEffect)"/>

</svg>