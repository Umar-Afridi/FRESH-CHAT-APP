<svg viewBox="0 0 400 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glowing edge filter for the bubble -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Silver/Metallic Gradient for the Crown -->
    <linearGradient id="silverCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a8b2b8" />
      <stop offset="100%" stop-color="#5a666e" />
    </linearGradient>

    <!-- Text Shadow for readability -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. CHAT BUBBLE BACKGROUND (Stretchable part) -->
  <!-- ========================================== -->
  <!-- Dark green background with bright cyan glowing border -->
  <rect id="BubbleBackground" x="40" y="30" width="280" height="120" rx="15" ry="15" fill="#032b22" stroke="#00ffd5" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Inner slight glow/gradient -->
  <rect x="42" y="32" width="276" height="116" rx="13" ry="13" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />

  <!-- Text Placeholder (Just to show how it looks) -->
  <text id="ChatText" x="180" y="100" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)">Hello</text>

  <!-- ========================================== -->
  <!-- 2. WINGS DECORATION (Fixed to Top-Left)      -->
  <!-- ========================================== -->
  <g id="TopLeftWings" transform="translate(25, 10)">
    <!-- Small box element -->
    <rect x="15" y="15" width="18" height="18" fill="#00ffd5" filter="url(#neonGlow)" />
    <!-- Wing Feathers -->
    <path d="M 15 15 Q -5 0 -10 20 Q -5 20 5 25 Q -10 30 -15 50 Q -5 45 5 55 Q -10 70 -5 90 Q 5 75 25 85 Q 15 65 20 40 Z" fill="#00ffd5" opacity="0.9" />
    <path d="M 17 20 Q 2 8 -2 22 Q 2 22 8 26 Q -2 30 -6 45 Q 2 40 8 48 Q -2 60 2 75 Q 8 62 20 70 Q 12 55 16 35 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- ========================================== -->
  <!-- 3. CROWN DECORATION (Fixed to Bottom-Right)  -->
  <!-- ========================================== -->
  <g id="BottomRightCrown" transform="translate(270, 100)">
    <!-- Crown Base -->
    <path d="M 0 50 L 70 50 L 65 25 L 50 40 L 35 10 L 20 40 L 5 25 Z" fill="url(#silverCrown)" stroke="#ffffff" stroke-width="1.5" />
    <!-- 3D Shadow/Depth for Crown -->
    <path d="M 0 50 L 70 50 L 65 60 L 5 60 Z" fill="#5a666e" />
    <path d="M 5 60 L 65 60 L 60 65 L 10 65 Z" fill="#3a4247" />
    <!-- Crown Jewels (Cyan dots) -->
    <circle cx="35" cy="10" r="3" fill="#00ffd5" filter="url(#neonGlow)"/>
    <circle cx="5" cy="25" r="2.5" fill="#00ffd5" />
    <circle cx="65" cy="25" r="2.5" fill="#00ffd5" />
  </g>

  <!-- ========================================== -->
  <!-- 4. FLOATING SPARKLES (Magic Stars)           -->
  <!-- ========================================== -->
  <g id="Sparkles" fill="#ffffff" filter="url(#neonGlow)">
    <!-- Top Left Star -->
    <polygon points="10,60 15,65 25,65 18,70 20,80 15,75 10,80 12,70 5,65 10,65" transform="translate(-15, -20) scale(0.6)" />
    <!-- Top Right Large Star -->
    <polygon points="330,15 333,30 348,33 333,36 330,51 327,36 312,33 327,30" transform="scale(0.8) translate(80, 0)" />
    <!-- Bottom Right Star -->
    <polygon points="310,180 312,185 318,187 312,189 310,195 308,189 302,187 308,185" transform="translate(30, -10)" />
  </g>
</svg>