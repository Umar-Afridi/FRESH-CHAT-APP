<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Dark Teal / Cyan Gradient for Chat Bubble Base -->
    <linearGradient id="tealBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005959"/>
      <stop offset="50%" stop-color="#002b2b"/>
      <stop offset="100%" stop-color="#001313"/>
    </linearGradient>

    <!-- Glowing Mint Green / Bright Cyan Border Gradient -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccffff"/>
      <stop offset="40%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00997a"/>
    </linearGradient>

    <!-- Realistic 3D Silver/Platinum Gradient for Crown -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d9d9d9"/>
      <stop offset="60%" stop-color="#999999"/>
      <stop offset="80%" stop-color="#e6e6e6"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>

    <!-- Vibrant Cyan Gem Gradient -->
    <linearGradient id="cyanGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66ffd9"/>
      <stop offset="50%" stop-color="#00e6b8"/>
      <stop offset="100%" stop-color="#008066"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="elementShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    
    <!-- Outer Glow for Cyan Edges and Sparkles -->
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkling Star Shape -->
    <g id="star">
      <path d="M0,-15 Q0,0 15,0 Q0,0 0,15 Q0,0 -15,0 Q0,0 0,-15 Z" fill="#ffffff" filter="url(#glowCyan)"/>
    </g>
  </defs>

  <style>
    /* BUBBLE IS FIXED - ONLY STARS BLINK FOR A PREMIUM FEEL */
    .twinkle1 { animation: blink 2s infinite alternate ease-in-out; }
    .twinkle2 { animation: blink 2.5s infinite alternate ease-in-out 0.5s; }
    .twinkle3 { animation: blink 1.8s infinite alternate ease-in-out 1s; }
    .twinkle4 { animation: blink 3s infinite alternate ease-in-out 0.2s; }
    
    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- BACKGROUND: Removed completely (Transparent) so it works perfectly on White or any other background -->

  <!-- BACKGROUND SPARKLES (Animated) -->
  <g transform="translate(90, 110)">
    <use href="#star" class="twinkle1" transform="scale(0.8)"/>
  </g>
  <g transform="translate(410, 80)">
    <use href="#star" class="twinkle2" transform="scale(1)"/>
  </g>
  <g transform="translate(400, 270)">
    <use href="#star" class="twinkle3" transform="scale(0.85)"/>
  </g>

  <!-- ========================================== -->
  <!-- MAIN CHAT BUBBLE (FIXED POSITION) -->
  <!-- ========================================== -->
  <g filter="url(#boxShadow)">
    <!-- Glowing Cyan Outer Edge -->
    <rect x="116" y="96" width="268" height="138" rx="18" fill="none" stroke="url(#cyanBorder)" stroke-width="5" filter="url(#glowCyan)" opacity="0.9"/>
    
    <!-- Base Teal Rectangle -->
    <rect x="120" y="100" width="260" height="130" rx="15" fill="url(#tealBase)" stroke="url(#cyanBorder)" stroke-width="2.5"/>
    
    <!-- Inner Glassy Highlight (Shine) -->
    <rect x="123" y="103" width="254" height="60" rx="12" fill="#ffffff" opacity="0.1"/>
    <rect x="122" y="102" width="256" height="126" rx="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- ========================================== -->
  <!-- EXTERNAL DECORATIONS -->
  <!-- ========================================== -->

  <!-- Top Left: Cyan Gem with Small Feather Wings -->
  <g transform="translate(125, 105)" filter="url(#elementShadow)">
    <!-- Tiny cyan feathers -->
    <path d="M -10,-10 Q -25,-20 -20,-35 Q -10,-20 -5,-15 Z" fill="#99ffff"/>
    <path d="M -15,-5 Q -30,-10 -35,-20 Q -20,-10 -10,-5 Z" fill="#00ffcc"/>
    
    <!-- Square Gem -->
    <rect x="-10" y="-12" width="18" height="18" rx="2" fill="url(#cyanGem)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Gem reflection -->
    <polygon points="-10,-12 8,6 8,-12" fill="#ffffff" opacity="0.4"/>
    
    <!-- Tiny Sparkle Dot -->
    <circle cx="-15" cy="-20" r="1.5" fill="#ffffff" class="twinkle4" filter="url(#glowCyan)"/>
  </g>

  <!-- Bottom Left: Elegant Teal & Cyan Feathers/Wings -->
  <g transform="translate(120, 230)" filter="url(#elementShadow)">
    <!-- Layered Feathers -->
    <path d="M 20,10 Q -5,20 -15,0 Q -5,10 10,5 Z" fill="#00b386"/>
    <path d="M 5,5 Q -20,10 -30,-15 Q -15,0 0,-5 Z" fill="#00e6b8"/>
    <path d="M -5,0 Q -30,-5 -30,-35 Q -15,-10 5,-15 Z" fill="#66ffd9"/>
    <path d="M -5,-10 Q -25,-20 -20,-45 Q -10,-20 0,-25 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Tiny Sparkle Dot -->
    <circle cx="20" cy="0" r="1.5" fill="#ffffff" class="twinkle4" filter="url(#glowCyan)"/>
  </g>

  <!-- Bottom Right: 3D Silver/Platinum Crown -->
  <g transform="translate(365, 225) rotate(-10)" filter="url(#elementShadow)">
    
    <!-- Crown Inside Cushion (Dark Grey/Silver) -->
    <path d="M-25,-5 Q-15,-30 -5,-5 Q5,-30 15,-5 Q25,-30 35,-5 L30,20 L-20,20 Z" fill="#999999"/>
    <path d="M-20,0 Q-10,-20 0,0 Q10,-20 20,0 Q30,-20 30,0 L25,20 L-15,20 Z" fill="#4d4d4d"/>

    <!-- Silver Crown Base & Spikes -->
    <path d="M-30,-10 L-20,20 L30,20 L40,-10 L20,5 L5,-20 L-10,5 Z" fill="url(#silverGrad)"/>
    <!-- Crown 3D Depth Shade -->
    <path d="M-25,-5 L-20,20 L30,20 L35,-5 L20,10 L5,-10 L-10,10 Z" fill="#666666" opacity="0.7"/>
    
    <!-- Crown Bottom Rim -->
    <rect x="-22" y="18" width="54" height="6" rx="3" fill="url(#silverGrad)"/>
    <rect x="-22" y="18" width="54" height="2" fill="#ffffff" opacity="0.8"/>

    <!-- Jewels on the crown peaks (Cyan Glowing) -->
    <circle cx="-30" cy="-10" r="3.5" fill="#e6ffff" filter="url(#glowCyan)"/>
    <circle cx="5" cy="-20" r="4" fill="#e6ffff" filter="url(#glowCyan)"/>
    <circle cx="40" cy="-10" r="3.5" fill="#e6ffff" filter="url(#glowCyan)"/>
  </g>

  <!-- ========================================== -->
  <!-- TEXT (HELLO) -->
  <!-- ========================================== -->
  <!-- Fixed Text, properly centered -->
  <text x="250" y="180" font-family="'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#elementShadow)">Hello</text>

</svg>