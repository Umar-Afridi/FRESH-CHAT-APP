<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <!-- Silver Gradients -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b0b0b0"/>
      <stop offset="75%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Gold Gradients for Crown, Shield Border, and Ribbon -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="25%" stop-color="#fbc02d"/>
      <stop offset="75%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>

    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>

    <!-- Emerald Green Gradient for Shield -->
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="50%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <!-- Glow Filter for Green Gem -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glow Filter specifically for Text Shine -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Left Wing Component -->
    <g id="left-wing">
      <!-- Gold Feathers -->
      <path d="M 200 250 C 130 200, 50 130, 40 80 C 100 130, 160 180, 200 210 Z" fill="url(#gold-grad)"/>
      <path d="M 200 300 C 110 270, 30 200, 20 140 C 90 200, 150 250, 200 260 Z" fill="url(#gold-grad)"/>
      <path d="M 200 350 C 110 330, 40 280, 30 220 C 100 270, 160 310, 200 310 Z" fill="url(#gold-grad)"/>
      
      <!-- White/Silver Feathers -->
      <path d="M 190 260 C 120 220, 60 150, 50 100 C 100 160, 150 210, 190 230 Z" fill="url(#silver-grad)"/>
      <path d="M 190 310 C 100 290, 40 220, 30 160 C 80 230, 140 280, 190 280 Z" fill="url(#silver-grad)"/>
      <path d="M 190 360 C 110 350, 50 300, 40 240 C 90 300, 150 330, 190 330 Z" fill="url(#silver-grad)"/>
    </g>
  </defs>

  <!-- Main Body Group (Static body, no bouncing) -->
  <g>
    <!-- Left Wings with Wind Swaying Animation -->
    <g>
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 200 260; 4 200 260; -1 200 260; 0 200 260" 
        dur="4s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <use href="#left-wing" x="0" y="0" />
    </g>
    
    <!-- Right Wings (Flipped) with Wind Swaying Animation -->
    <g transform="translate(600, 0) scale(-1, 1)">
      <g>
        <animateTransform 
          attributeName="transform" 
          type="rotate" 
          values="0 200 260; -4 200 260; 1 200 260; 0 200 260" 
          dur="4.2s" 
          repeatCount="indefinite" 
          calcMode="spline" 
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <use href="#left-wing" x="0" y="0" />
      </g>
    </g>

    <!-- Main Shield -->
    <g id="shield">
      <!-- Gold Outer Border -->
      <path d="M 190 170 L 410 170 L 420 320 Q 420 450 300 510 Q 180 450 180 320 Z" fill="url(#gold-grad)" stroke="url(#gold-dark)" stroke-width="4"/>
      <!-- Inner Green Shield -->
      <path d="M 210 190 L 390 190 L 398 315 Q 398 420 300 480 Q 202 420 202 315 Z" fill="url(#green-grad)"/>
      <!-- Silver Inner Border Line -->
      <path d="M 215 195 L 385 195 L 392 315 Q 392 410 300 465 Q 208 410 208 315 Z" fill="none" stroke="url(#silver-grad)" stroke-width="5"/>
    </g>

    <!-- Center Gem (Hexagon Design) -->
    <g id="diamond" transform="translate(300, 310)">
      <!-- Outer Hexagon Frame -->
      <path d="M -45 -50 L 45 -50 L 60 15 L 0 70 L -60 15 Z" fill="none" stroke="url(#silver-grad)" stroke-width="14" stroke-linejoin="round"/>
      <path d="M -45 -50 L 45 -50 L 60 15 L 0 70 L -60 15 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Inner Green Base -->
      <path d="M -35 -40 L 35 -40 L 45 10 L 0 55 L -45 10 Z" fill="url(#green-grad)" stroke="url(#silver-grad)" stroke-width="3"/>
      
      <!-- Glowing Green Core -->
      <circle cx="0" cy="5" r="18" fill="#00ff88" filter="url(#glow)">
        <animate attributeName="r" values="14; 22; 14" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite" />
      </circle>
      <!-- Small Light Reflection -->
      <path d="M -10 -5 Q 0 -15 10 -5 Q 0 5 -10 -5 Z" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Gold Crown with Green Jewels -->
    <g id="crown" transform="translate(0, 15)">
      <!-- Crown Base -->
      <path d="M 225 155 L 210 75 L 255 105 L 300 45 L 345 105 L 390 75 L 375 155 Z" fill="url(#gold-grad)" stroke="url(#gold-dark)" stroke-width="2"/>
      <!-- Crown Rim -->
      <rect x="220" y="145" width="160" height="20" rx="8" fill="url(#gold-grad)" stroke="url(#gold-dark)" stroke-width="2"/>
      
      <!-- Green Jewels -->
      <circle cx="240" cy="155" r="5" fill="#00e676" stroke="#1b5e20" stroke-width="1"/>
      <circle cx="270" cy="155" r="5" fill="#00e676" stroke="#1b5e20" stroke-width="1"/>
      <circle cx="300" cy="155" r="5" fill="#00e676" stroke="#1b5e20" stroke-width="1"/>
      <circle cx="330" cy="155" r="5" fill="#00e676" stroke="#1b5e20" stroke-width="1"/>
      <circle cx="360" cy="155" r="5" fill="#00e676" stroke="#1b5e20" stroke-width="1"/>
      
      <!-- Top Dots -->
      <circle cx="210" cy="70" r="7" fill="url(#gold-grad)"/>
      <circle cx="255" cy="100" r="6" fill="url(#gold-grad)"/>
      <circle cx="300" cy="40" r="9" fill="url(#gold-grad)" filter="url(#glow)"/>
      <circle cx="345" cy="100" r="6" fill="url(#gold-grad)"/>
      <circle cx="390" cy="70" r="7" fill="url(#gold-grad)"/>
    </g>

    <!-- Gold Banner / Ribbon at Bottom -->
    <g id="banner" transform="translate(0, 440)">
      <!-- Left Ribbon Fold -->
      <path d="M 180 0 L 130 -30 L 160 30 L 120 70 L 200 40 Z" fill="url(#gold-dark)"/>
      <!-- Right Ribbon Fold -->
      <path d="M 420 0 L 470 -30 L 440 30 L 480 70 L 400 40 Z" fill="url(#gold-dark)"/>
      
      <!-- Main Front Ribbon -->
      <path d="M 170 -5 Q 300 45 430 -5 L 410 55 Q 300 100 190 55 Z" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Text Shadow -->
      <text x="300" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#a0522d" text-anchor="middle" letter-spacing="2">SVIP 2</text>
      
      <!-- Solid White Main Text -->
      <text x="300" y="55" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SVIP 2</text>
      
      <!-- Shiny Glowing Text Layer (Animated Shine Effect matching Gold theme) -->
      <text x="300" y="55" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#fff59d" filter="url(#text-glow)" text-anchor="middle" letter-spacing="2">
        <animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite" />
        SVIP 2
      </text>
    </g>
  </g>
</svg>