<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Realistic 3D Gradients for Lips -->
    <linearGradient id="upperLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d79"/>
      <stop offset="25%" stop-color="#e6002e"/>
      <stop offset="70%" stop-color="#99001f"/>
      <stop offset="100%" stop-color="#33000a"/>
    </linearGradient>

    <linearGradient id="lowerLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff80a6"/>
      <stop offset="20%" stop-color="#ff1a53"/>
      <stop offset="50%" stop-color="#cc0033"/>
      <stop offset="85%" stop-color="#66001a"/>
      <stop offset="100%" stop-color="#1a0005"/>
    </linearGradient>

    <!-- Super bright Chamak (Shine) Gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Drop Shadow for popping out on any transparent/GIF background -->
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#ff0040" flood-opacity="0.6"/>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blurs for Wet/Glossy Highlights -->
    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="heavy-blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Clip Path matching the NEW perfectly balanced lips for the running shine -->
    <clipPath id="lipsClip">
      <!-- Upper Lip: Bigger with strong "M" shape -->
      <path d="M 80 240 C 110 130, 200 130, 250 190 C 300 130, 390 130, 420 240 C 350 225, 300 220, 250 235 C 200 220, 150 225, 80 240 Z" />
      <!-- Lower Lip: Thinner and balanced -->
      <path d="M 85 245 C 150 235, 200 230, 250 240 C 300 230, 350 235, 415 245 C 370 350, 290 360, 250 360 C 210 360, 130 350, 85 245 Z" />
    </clipPath>
  </defs>

  <!-- Group rotated for the classic realistic 💋 angle -->
  <g transform="rotate(-15, 250, 250)" filter="url(#drop-shadow)">
    
    <!-- Deep Mouth Shadow (Creates Depth between lips) -->
    <path d="M 75 245 C 140 235, 200 230, 250 238 C 300 230, 360 235, 425 245 C 360 250, 300 245, 250 242 C 200 245, 140 250, 75 245 Z" fill="#1a0005" />

    <!-- Upper Lip (Bigger, prominent M shape) -->
    <path d="M 80 240 C 110 130, 200 130, 250 190 C 300 130, 390 130, 420 240 C 350 225, 300 220, 250 235 C 200 220, 150 225, 80 240 Z" fill="url(#upperLipGrad)" />

    <!-- Lower Lip (Thinner, perfectly balanced) -->
    <path d="M 85 245 C 150 235, 200 230, 250 240 C 300 230, 350 235, 415 245 C 370 350, 290 360, 250 360 C 210 360, 130 350, 85 245 Z" fill="url(#lowerLipGrad)" />

    <!-- Realistic Lip Texture / Creases (Subtle Lines) -->
    <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.15" filter="url(#soft-blur)">
      <!-- Lower Lip Lines -->
      <path d="M 250 245 Q 250 310 250 355" />
      <path d="M 230 243 Q 225 310 215 350" />
      <path d="M 270 243 Q 275 310 285 350" />
      <path d="M 210 243 Q 200 305 185 340" />
      <path d="M 290 243 Q 300 305 315 340" />
      <path d="M 190 244 Q 175 300 155 330" />
      <path d="M 310 244 Q 325 300 345 330" />
      <path d="M 170 245 Q 150 290 130 310" />
      <path d="M 330 245 Q 350 290 370 310" />
      
      <!-- Upper Lip Lines (Extended for bigger lip) -->
      <path d="M 230 230 Q 220 170 210 150" />
      <path d="M 270 230 Q 280 170 290 150" />
      <path d="M 200 225 Q 185 170 170 160" />
      <path d="M 300 225 Q 315 170 330 160" />
      <path d="M 160 225 Q 140 180 120 170" />
      <path d="M 340 225 Q 360 180 380 170" />
    </g>

    <!-- Dark Creases for extreme realism -->
    <g stroke="#4a0012" stroke-width="2" fill="none" opacity="0.25" filter="url(#soft-blur)">
      <path d="M 240 240 Q 240 310 240 355" />
      <path d="M 260 240 Q 260 310 260 355" />
      <path d="M 220 241 Q 212 300 200 345" />
      <path d="M 280 241 Q 288 300 300 345" />
    </g>

    <!-- 3D Wet & Glossy Highlights (Static) -->
    <g fill="#ffffff">
      <!-- Upper lip arch gloss (Moved up to match new M shape) -->
      <path d="M 130 165 C 160 145, 190 150, 215 170 C 185 160, 155 160, 130 165 Z" filter="url(#soft-blur)" opacity="0.8"/>
      <path d="M 370 165 C 340 145, 310 150, 285 170 C 315 160, 345 160, 370 165 Z" filter="url(#soft-blur)" opacity="0.8"/>
      
      <!-- Upper lip inner glow -->
      <path d="M 230 220 C 240 215, 260 215, 270 220 C 260 225, 240 225, 230 220 Z" filter="url(#soft-blur)" opacity="0.5"/>
      
      <!-- Lower lip intense wet shine -->
      <path d="M 150 260 C 210 250, 290 250, 350 260 C 310 270, 190 270, 150 260 Z" filter="url(#heavy-blur)" opacity="0.7"/>
      <path d="M 170 265 C 220 255, 280 255, 330 265 C 280 270, 220 270, 170 265 Z" filter="url(#soft-blur)" opacity="0.9"/>
      
      <!-- Lower lip bottom plump reflection -->
      <path d="M 190 325 C 230 345, 270 345, 310 325 C 270 335, 230 335, 190 325 Z" filter="url(#soft-blur)" opacity="0.4"/>
    </g>

    <!-- The Running Chamak Patti (Animated Shine Effect) -->
    <g clip-path="url(#lipsClip)">
      <!-- Main wide shine -->
      <rect x="-300" y="50" width="80" height="400" fill="url(#shineGrad)" transform="skewX(-25)">
        <animate attributeName="x" from="-300" to="600" dur="2.5s" repeatCount="indefinite" />
      </rect>
      <!-- Secondary bright thin shine following behind -->
      <rect x="-180" y="50" width="20" height="400" fill="url(#shineGrad)" transform="skewX(-25)">
        <animate attributeName="x" from="-180" to="720" dur="2.5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Glowing & Twinkling Realistic Stars / Sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Big Star Top Right -->
    <g transform="translate(410, 80)">
      <path d="M 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Q 15 15 15 0 Z">
        <animateTransform attributeName="transform" type="scale" values="0.6; 1.4; 0.6" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite" />
      </path>
      <!-- Center dot for intense glow -->
      <circle cx="15" cy="15" r="2" fill="#fff" />
    </g>
    
    <!-- Medium Star Bottom Left -->
    <g transform="translate(60, 360)">
      <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z">
        <animateTransform attributeName="transform" type="scale" values="0.8; 1.5; 0.8" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.8s" repeatCount="indefinite" />
      </path>
    </g>
    
    <!-- Small Star Top Left -->
    <g transform="translate(100, 90)">
      <path d="M 10 0 Q 10 10 20 10 Q 10 10 10 20 Q 10 10 0 10 Q 10 10 10 0 Z" fill="#ffb3c6">
        <animateTransform attributeName="transform" type="scale" values="0.5; 1.2; 0.5" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0; 0.9; 0" dur="1.7s" repeatCount="indefinite" />
      </path>
    </g>
    
    <!-- Medium Star Bottom Right -->
    <g transform="translate(390, 330)">
      <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z" fill="#ffccd5">
        <animateTransform attributeName="transform" type="scale" values="0.4; 1.3; 0.4" dur="2.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 1; 0.1" dur="2.3s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>