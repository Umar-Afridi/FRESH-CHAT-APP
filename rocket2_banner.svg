<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="mainBgGrad_b" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#003399" />
            <stop offset="50%" stop-color="#0055CC" />
            <stop offset="80%" stop-color="#00AAFF" />
            <stop offset="100%" stop-color="#0077EE" />
        </linearGradient>

        <linearGradient id="silverFrame_b" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#C5DEFF" />
            <stop offset="100%" stop-color="#709BE0" />
        </linearGradient>

        <linearGradient id="darkInner_b" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#001144" />
            <stop offset="100%" stop-color="#000822" />
        </linearGradient>

        <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00FFFF" />
            <stop offset="50%" stop-color="#00BFFF" />
            <stop offset="100%" stop-color="#0066FF" />
        </linearGradient>

        <linearGradient id="goldBtn_b" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF3CD" />
            <stop offset="50%" stop-color="#F6D365" />
            <stop offset="100%" stop-color="#EDA332" />
        </linearGradient>

        <filter id="neonGlow_b"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
        <filter id="dropShadow_b"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/></filter>
        <filter id="blueGlow"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FFFF" flood-opacity="0.8"/></filter>

        <clipPath id="shineClip_b"><rect x="50" y="110" width="1000" height="130" rx="10" /></clipPath>
        <linearGradient id="shineLight_b" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.7)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>

        <g id="wing-half_b" filter="url(#dropShadow_b)">
            <path d="M 45 40 L 120 40 L 150 20 L 450 20 L 470 -25 L 170 -25 L 130 15 L 60 15 Z" fill="url(#silverFrame_b)"/>
            <path d="M 45 40 L 80 80 L 105 40 Z" fill="url(#silverFrame_b)"/>
            <path d="M 50 35 L 115 35 L 145 15 L 440 15 L 455 -20 L 175 -20 L 135 10 L 65 10 Z" fill="url(#darkInner_b)"/>
            <path d="M 50 35 L 80 70 L 100 35 Z" fill="url(#darkInner_b)"/>
            <path d="M 190 15 L 230 15 L 210 -20 L 175 -20 Z" fill="url(#neonBlue)" filter="url(#neonGlow_b)"/>
            <path d="M 240 15 L 260 15 L 240 -20 L 220 -20 Z" fill="url(#neonBlue)"/>
            <g transform="translate(360, -5)">
                <polygon points="0,-25 25,0 0,25 -25,0" fill="url(#neonBlue)" filter="url(#blueGlow)"/>
                <polygon points="0,-15 15,0 0,15 -15,0" fill="#FFFFFF"/>
                <path d="M 0,-30 L 2,-5 L 30,0 L 2,5 L 0,30 L -2,5 L -30,0 L -2,-5 Z" fill="#FFFFFF" transform="scale(0.6)"/>
            </g>
        </g>
        <path id="star_b" d="M 0,-8 L 1.5,-2 L 8,0 L 1.5,2 L 0,8 L -1.5,2 L -8,0 L -1.5,-2 Z" fill="#FFFFFF" filter="drop-shadow(0 0 3px #FFF)"/>
    </defs>

    <style>
        @keyframes sweep_b { 0% { transform: translateX(-200px) skewX(-25deg); } 100% { transform: translateX(1200px) skewX(-25deg); } }
        @keyframes twinkle_b { 0%, 100% { transform: scale(0.5); opacity: 0.3; } 50% { transform: scale(1.3); opacity: 1; } }
        @keyframes pulseGlow_b { 0%, 100% { filter: drop-shadow(0 0 5px #00FFFF); } 50% { filter: drop-shadow(0 0 15px #00FFFF); } }
        @keyframes lightningStrike_b { 0%, 95%, 100% { opacity: 0.1; } 96%, 98% { opacity: 0.8; } }

        .shine-box_b { animation: sweep_b 3.5s infinite ease-in-out; }
        .st1_b { animation: twinkle_b 1.5s infinite ease-in-out; }
        .st2_b { animation: twinkle_b 2s infinite ease-in-out 0.5s; }
        .st3_b { animation: twinkle_b 1.8s infinite ease-in-out 1s; }
        .pulse-circle_b { animation: pulseGlow_b 2s infinite ease-in-out; }
        .lightning_b { animation: lightningStrike_b 4s infinite linear; }
    </style>

    <rect x="50" y="110" width="1000" height="130" rx="15" fill="url(#mainBgGrad_b)" filter="url(#dropShadow_b)"/>
    <rect x="50" y="110" width="1000" height="4" rx="2" fill="#85D6FF" opacity="0.8"/>
    
    <g class="lightning_b" fill="none" stroke="#66CCFF" stroke-width="1.5">
        <path d="M 150 110 L 180 140 L 160 170 L 220 220" />
        <path d="M 300 240 L 330 200 L 310 160 L 380 110" />
        <path d="M 700 110 L 680 160 L 720 190 L 690 240" />
    </g>

    <g clip-path="url(#shineClip_b)"><rect class="shine-box_b" x="0" y="0" width="150" height="300" fill="url(#shineLight_b)" /></g>

    <g transform="translate(550, 80)">
        <use href="#wing-half_b" />
        <use href="#wing-half_b" transform="scale(-1, 1)" />
        <circle cx="0" cy="0" r="45" fill="url(#darkInner_b)" stroke="url(#neonBlue)" stroke-width="6" class="pulse-circle_b"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="url(#silverFrame_b)" stroke-width="2"/>
        <circle cx="0" cy="0" r="32" fill="#000C22" />
        <text x="-2" y="15" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" filter="url(#blueGlow)" text-anchor="middle">2</text>
        <text x="-2" y="15" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <rect x="860" y="145" width="140" height="60" rx="30" fill="url(#goldBtn_b)" filter="url(#dropShadow_b)"/>
    <text x="930" y="185" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#5A2E00" text-anchor="middle">Go</text>

    <use href="#star_b" x="90" y="90" class="st1_b" /><use href="#star_b" x="250" y="210" class="st2_b" /><use href="#star_b" x="420" y="70" class="st3_b" />
    <use href="#star_b" x="680" y="220" class="st1_b" /><use href="#star_b" x="820" y="80" class="st2_b" /><use href="#star_b" x="1020" y="130" class="st3_b" />
</svg>