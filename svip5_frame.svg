<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow-5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#220000" flood-opacity="0.9"/>
    </filter>
    <filter id="glow-5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="text-shadow-5">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#4A0000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF1744" flood-opacity="0.8"/>
    </filter>

    <linearGradient id="gold-bright-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/><stop offset="25%" stop-color="#FFD54F"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="gold-dark-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8F00"/><stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="red-bright-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/><stop offset="40%" stop-color="#FF0000"/><stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="red-dark-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C"/><stop offset="100%" stop-color="#330000"/>
    </linearGradient>
    <linearGradient id="text-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#FFD54F"/><stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>

    <!-- PERFECT MASK -->
    <mask id="perfect-mask-5">
      <circle cx="250" cy="250" r="168" fill="none" stroke="#FFFFFF" stroke-width="26" />
      <circle cx="250" cy="250" r="165" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-dasharray="25 20"/>
      <circle cx="250" cy="250" r="158" fill="none" stroke="#FFFFFF" stroke-width="14" />
      <circle cx="250" cy="250" r="148" fill="none" stroke="#FFFFFF" stroke-width="5" />
      <g id="mask-wings-5">
        <path d="M 110,390 C -20,320 -30,120 120,60 C 10,170 10,310 130,370 Z" fill="#FFFFFF"/>
        <path d="M 120,360 C 20,280 10,150 120,90 C 30,190 30,290 140,340 Z" fill="#FFFFFF"/>
        <path d="M 130,330 C 50,260 40,160 130,110 C 60,190 60,270 150,310 Z" fill="#FFFFFF"/>
        <path d="M 100,140 L 5,70 L 60,180 Z" fill="#FFFFFF"/>
        <path d="M 90,145 L 20,85 L 55,170 Z" fill="#FFFFFF"/>
        <path d="M 90,210 L -15,180 L 60,250 Z" fill="#FFFFFF"/>
        <path d="M 80,215 L 0,190 L 55,240 Z" fill="#FFFFFF"/>
        <path d="M 100,280 L -10,290 L 70,320 Z" fill="#FFFFFF"/>
        <path d="M 90,285 L 5,295 L 65,310 Z" fill="#FFFFFF"/>
        <path d="M 120,350 L 15,410 L 100,320 Z" fill="#FFFFFF"/>
        <path d="M 110,340 L 35,390 L 90,325 Z" fill="#FFFFFF"/>
        <path d="M 210,60 C 150,35 100,80 85,130 C 130,75 180,70 200,75 Z" fill="#FFFFFF"/>
      </g>
      <use href="#mask-wings-5"/>
      <use href="#mask-wings-5" transform="translate(500, 0) scale(-1, 1)"/>
      <polygon points="250,110 160,65 250,10 340,65" fill="#FFFFFF"/>
      <path d="M 160,65 L 140,25 L 175,55 Z" fill="#FFFFFF"/>
      <path d="M 340,65 L 360,25 L 325,55 Z" fill="#FFFFFF"/>
      <path d="M 190,65 L 175,15 L 210,55 Z" fill="#FFFFFF"/>
      <path d="M 310,65 L 325,15 L 290,55 Z" fill="#FFFFFF"/>
      <path d="M 220,65 L 205,5 L 240,55 Z" fill="#FFFFFF"/>
      <path d="M 280,65 L 295,5 L 260,55 Z" fill="#FFFFFF"/>
      <path d="M 250,5 L 220,60 L 250,90 L 280,60 Z" fill="#FFFFFF"/>
      <polygon points="250,90 220,105 250,145 280,105" fill="#FFFFFF"/>
      <path d="M 100,390 L 70,445 L 140,450 Z" fill="#FFFFFF"/>
      <path d="M 400,390 L 430,445 L 360,450 Z" fill="#FFFFFF"/>
      <path d="M 110,380 C 180,370 220,385 250,395 C 280,385 320,370 390,380 L 405,440 C 320,450 280,465 250,480 C 220,465 180,450 95,440 Z" fill="#FFFFFF"/>
      <path d="M 110,380 C 180,370 220,385 250,395 C 280,385 320,370 390,380 L 405,440 C 320,450 280,465 250,480 C 220,465 180,450 95,440 Z" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M 100,355 L 135,380 L 110,460 L 70,425 Z" fill="#FFFFFF"/>
      <path d="M 400,355 L 365,380 L 390,460 L 430,425 Z" fill="#FFFFFF"/>
      <polygon points="250,480 225,505 250,540 275,505" fill="#FFFFFF"/>
      <text x="250" y="442" dominant-baseline="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">SVIP 5</text>
    </mask>

    <g id="dragon-wing-5">
      <path d="M 110,390 C -20,320 -30,120 120,60 C 10,170 10,310 130,370 Z" fill="url(#red-dark-5)"/>
      <path d="M 120,360 C 20,280 10,150 120,90 C 30,190 30,290 140,340 Z" fill="url(#gold-dark-5)"/>
      <path d="M 130,330 C 50,260 40,160 130,110 C 60,190 60,270 150,310 Z" fill="url(#red-bright-5)"/>
      <path d="M 100,140 L 5,70 L 60,180 Z" fill="url(#gold-bright-5)" filter="url(#shadow-5)"/>
      <path d="M 90,145 L 20,85 L 55,170 Z" fill="url(#red-bright-5)"/>
      <path d="M 90,210 L -15,180 L 60,250 Z" fill="url(#gold-bright-5)" filter="url(#shadow-5)"/>
      <path d="M 80,215 L 0,190 L 55,240 Z" fill="url(#gold-dark-5)"/>
      <path d="M 100,280 L -10,290 L 70,320 Z" fill="url(#gold-bright-5)" filter="url(#shadow-5)"/>
      <path d="M 90,285 L 5,295 L 65,310 Z" fill="url(#red-bright-5)"/>
      <path d="M 120,350 L 15,410 L 100,320 Z" fill="url(#gold-bright-5)" filter="url(#shadow-5)"/>
      <path d="M 110,340 L 35,390 L 90,325 Z" fill="url(#gold-dark-5)"/>
      <polygon points="45,160 35,175 45,190 55,175" fill="#FFD54F" filter="url(#glow-5)"/>
      <path d="M 210,60 C 150,35 100,80 85,130 C 130,75 180,70 200,75 Z" fill="url(#gold-bright-5)"/>
    </g>
  </defs>

  <g filter="url(#shadow-5)">
    <circle cx="250" cy="250" r="168" fill="none" stroke="url(#red-dark-5)" stroke-width="26" />
    <circle cx="250" cy="250" r="165" fill="none" stroke="url(#gold-bright-5)" stroke-width="10" stroke-dasharray="25 20"/>
    <circle cx="250" cy="250" r="158" fill="none" stroke="url(#red-bright-5)" stroke-width="14" />
    <circle cx="250" cy="250" r="148" fill="none" stroke="url(#gold-bright-5)" stroke-width="5" />
  </g>

  <g filter="url(#shadow-5)">
    <use href="#dragon-wing-5" x="0" y="0"/>
    <use href="#dragon-wing-5" x="0" y="0" transform="translate(500, 0) scale(-1, 1)"/>
  </g>

  <g filter="url(#shadow-5)">
    <polygon points="250,110 160,65 250,10 340,65" fill="url(#red-dark-5)"/>
    <path d="M 160,65 L 140,25 L 175,55 Z" fill="url(#gold-dark-5)"/>
    <path d="M 340,65 L 360,25 L 325,55 Z" fill="url(#gold-dark-5)"/>
    <path d="M 190,65 L 175,15 L 210,55 Z" fill="url(#red-bright-5)"/>
    <path d="M 310,65 L 325,15 L 290,55 Z" fill="url(#red-bright-5)"/>
    <path d="M 220,65 L 205,5 L 240,55 Z" fill="url(#gold-bright-5)"/>
    <path d="M 280,65 L 295,5 L 260,55 Z" fill="url(#gold-bright-5)"/>
    <path d="M 250,5 L 220,60 L 250,90 L 280,60 Z" fill="url(#gold-bright-5)"/>
    <polygon points="250,30 230,55 250,80 270,55" fill="#FF0000" stroke="#FFF9C4" stroke-width="2" filter="url(#glow-5)"/>
    <polygon points="250,90 220,105 250,145 280,105" fill="url(#red-bright-5)"/>
    <polygon points="250,90 250,145 280,105" fill="url(#red-dark-5)"/>
  </g>

  <g filter="url(#shadow-5)">
    <path d="M 100,390 L 70,445 L 140,450 Z" fill="url(#red-dark-5)"/>
    <path d="M 400,390 L 430,445 L 360,450 Z" fill="url(#red-dark-5)"/>
    <path d="M 110,380 C 180,370 220,385 250,395 C 280,385 320,370 390,380 L 405,440 C 320,450 280,465 250,480 C 220,465 180,450 95,440 Z" fill="url(#red-dark-5)"/>
    <path d="M 115,385 C 180,375 220,390 250,400 C 280,390 320,375 385,385 L 395,435 C 320,445 280,460 250,470 C 220,460 180,445 105,435 Z" fill="url(#red-bright-5)"/>
    <path d="M 110,380 C 180,370 220,385 250,395 C 280,385 320,370 390,380 L 405,440 C 320,450 280,465 250,480 C 220,465 180,450 95,440 Z" fill="none" stroke="url(#gold-bright-5)" stroke-width="6"/>
    <path d="M 100,355 L 135,380 L 110,460 L 70,425 Z" fill="url(#gold-bright-5)"/>
    <path d="M 400,355 L 365,380 L 390,460 L 430,425 Z" fill="url(#gold-bright-5)"/>
    <polygon points="250,480 225,505 250,540 275,505" fill="url(#gold-bright-5)" filter="url(#glow-5)"/>
  </g>

  <text x="250" y="442" dominant-baseline="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="url(#text-grad-5)" text-anchor="middle" letter-spacing="5" filter="url(#text-shadow-5)">SVIP 5</text>

  <!-- PERFECT SHINE SWEEP -->
  <g mask="url(#perfect-mask-5)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-250 -150; 850 450" dur="3s" repeatCount="indefinite" />
      <linearGradient id="shine-sweep-5" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="-400" width="50" height="1300" fill="url(#shine-sweep-5)" transform="rotate(35)" />
      <rect x="80" y="-400" width="100" height="1300" fill="url(#shine-sweep-5)" transform="rotate(35)" opacity="0.5"/>
    </g>
  </g>
</svg>