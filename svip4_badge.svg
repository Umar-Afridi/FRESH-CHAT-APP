<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <!-- Ultra Premium Gold Gradient for Borders, Wings and Crown -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="25%" stop-color="#fbc02d"/>
      <stop offset="50%" stop-color="#f57f17"/>
      <stop offset="75%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </linearGradient>

    <!-- Deep Gold for Shadowed Wing Areas -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Horizontal Bright Gold for the SVIP 4 Text -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="70%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Royal Purple Gradient for the Badge Background -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d500f9"/>
      <stop offset="40%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>

    <!-- Velvet Magenta Gradient for Crown Interior -->
    <linearGradient id="magenta-velvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#c51162"/>
    </linearGradient>

    <!-- Drop Shadow for the Entire Badge to make it pop out -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Intense Glow Filter for Text, Orbs & Crown Jewels -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path to keep the shine animation exactly inside the badge -->
    <clipPath id="badge-clip">
      <rect x="70" y="35" width="370" height="80" rx="40"/>
    </clipPath>

    <!-- Sparkle Star Shape -->
    <g id="sparkle">
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z" fill="#ffffff" filter="url(#glow)"/>
    </g>
  </defs>

  <!-- مین گروپ کو سکرین کے بالکل سینٹر میں سیٹ کیا گیا ہے -->
  <g transform="translate(60, 230)">
    
    <!-- ========================================== -->
    <!-- 1. MULTI-LAYERED ANIMATED RIGHT WING (Advanced) -->
    <!-- ========================================== -->
    <g transform="translate(425, 45)">
      <!-- Back Layer Feather (Slower flap) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 5 25; 15 5 25; 0 5 25" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <path d="M 0 5 C 40 -15 65 15 65 25 C 50 15 35 20 20 30 Z" fill="url(#gold-dark)"/>
      </g>
      <!-- Middle Layer Feather (Normal flap) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 5 25; -8 5 25; 5 5 25; 0 5 25" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <path d="M 0 10 C 35 -10 60 25 60 35 C 45 25 30 30 15 40 Z" fill="url(#gold-grad)"/>
      </g>
      <!-- Front Layer Feather (Fastest flap) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 5 25; -15 5 25; 8 5 25; 0 5 25" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <path d="M 0 15 C 30 -5 50 35 55 45 C 35 35 20 40 5 50 C 15 45 35 50 40 60 C 20 50 10 45 -5 30 Z" fill="url(#gold-grad)"/>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- 2. MAIN PILL / BADGE BACKGROUND -->
    <!-- ========================================== -->
    <g filter="url(#shadow)">
      <!-- Outer Gold Border -->
      <rect x="70" y="35" width="370" height="80" rx="40" fill="url(#gold-grad)"/>
      
      <!-- Inner Royal Purple Background -->
      <rect x="73" y="38" width="364" height="74" rx="37" fill="url(#purple-grad)"/>
      
      <!-- Top Decorative Center Accent (New in SVIP 4) -->
      <path d="M 230 36 L 245 22 L 255 12 L 265 22 L 280 36 Z" fill="url(#gold-grad)"/>
      <polygon points="255,16 261,24 255,32 249,24" fill="#ea80fc" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.5s" repeatCount="indefinite"/>
      </polygon>

      <!-- Animated Inner 3D Breathing Border -->
      <rect x="76" y="41" width="358" height="68" rx="34" fill="none" stroke="#fff59d" stroke-width="2">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>


    <!-- ========================================== -->
    <!-- 3. TRIPLE SHINE ANIMATION (Inside the Pill) -->
    <!-- ========================================== -->
    <g clip-path="url(#badge-clip)">
      <!-- 1st Light Beam: Fast and Sharp -->
      <polygon points="-30,-20 0,-20 50,120 20,120" fill="#ffffff" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="-150 0; 600 0; 600 0" keyTimes="0; 0.3; 1" dur="4s" repeatCount="indefinite" />
      </polygon>
      
      <!-- 2nd Light Beam: Medium and Wide -->
      <polygon points="10,-20 60,-20 110,120 60,120" fill="#ffffff" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" values="-200 0; 600 0; 600 0" keyTimes="0; 0.4; 1" dur="4s" repeatCount="indefinite" />
      </polygon>

      <!-- 3rd Light Beam: Slow Reverse Sweep (Extra Magic) -->
      <polygon points="400,-20 420,-20 370,120 350,120" fill="#ea80fc" opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="200 0; -600 0; -600 0" keyTimes="0; 0.5; 1" dur="5s" repeatCount="indefinite" />
      </polygon>
    </g>


    <!-- ========================================== -->
    <!-- 4. SVIP 4 TEXT WITH ADVANCED GLOW -->
    <!-- ========================================== -->
    <g transform="translate(260, 90)">
      <!-- Text Dark Shadow for Depth -->
      <text x="0" y="4" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="900" fill="#2a004d" text-anchor="middle" letter-spacing="3">SVIP 4</text>
      
      <!-- Main Gold Text -->
      <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="900" fill="url(#gold-text)" text-anchor="middle" letter-spacing="3">SVIP 4</text>
      
      <!-- Animated Breathing Gold Glow -->
      <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="900" fill="#fff59d" filter="url(#glow-heavy)" text-anchor="middle" letter-spacing="3">
        <animate attributeName="opacity" values="0.1; 0.8; 0.1" dur="2s" repeatCount="indefinite" />
        SVIP 4
      </text>
    </g>


    <!-- ========================================== -->
    <!-- 5. SHIELD & CROWN (Smooth Floating Animation) -->
    <!-- ========================================== -->
    <g id="shield-group">
      <!-- شیلڈ کے اوپر نیچے تیرنے (Float) کی زیادہ گہری اور سمتھ اینیمیشن -->
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      
      <!-- Left Gold Wings -->
      <path d="M 50 50 C 25 35 5 35 5 35 C 25 50 35 60 40 65 Z" fill="url(#gold-grad)"/>
      <path d="M 45 70 C 20 60 0 65 0 65 C 20 75 30 80 35 85 Z" fill="url(#gold-grad)"/>
      <path d="M 42 85 C 15 80 5 90 5 90 C 20 95 30 95 35 100 Z" fill="url(#gold-grad)"/>
      
      <!-- Right Gold Wings (attached to shield) -->
      <path d="M 130 50 C 155 35 175 35 175 35 C 155 50 145 60 140 65 Z" fill="url(#gold-grad)"/>
      <path d="M 135 70 C 160 60 180 65 180 65 C 160 75 150 80 145 85 Z" fill="url(#gold-grad)"/>
      <path d="M 138 85 C 165 80 175 90 175 90 C 160 95 150 95 145 100 Z" fill="url(#gold-grad)"/>

      <!-- Main Shield Outer Gold Border -->
      <path d="M 45 35 L 135 35 L 142 80 Q 142 125 90 150 Q 38 125 38 80 Z" fill="url(#gold-grad)" filter="url(#shadow)"/>
      
      <!-- Inner Royal Purple Shield -->
      <path d="M 50 40 L 130 40 L 135 80 Q 135 120 90 143 Q 45 120 45 80 Z" fill="url(#purple-grad)"/>
      
      <!-- Inner Shield Gold Outline -->
      <path d="M 53 43 L 127 43 L 132 80 Q 132 115 90 136 Q 48 115 48 80 Z" fill="none" stroke="#fff59d" stroke-width="2"/>

      <!-- Crown Inside the Shield -->
      <!-- Velvet Magenta Background Inside Crown -->
      <path d="M 65 88 L 60 65 C 70 50 110 50 120 65 L 115 88 Z" fill="url(#magenta-velvet)"/>

      <rect x="65" y="90" width="50" height="8" rx="3" fill="url(#gold-grad)"/>
      <rect x="67" y="102" width="46" height="3" rx="1" fill="url(#gold-grad)"/>
      <path d="M 65 88 L 60 65 L 75 80 L 90 55 L 105 80 L 120 65 L 115 88 Z" fill="url(#gold-grad)"/>
      <path d="M 60 65 C 75 55 105 55 120 65" fill="none" stroke="url(#gold-grad)" stroke-width="2"/>
      
      <!-- Animated Crown Jewels (Glowing Magenta & White Dots) -->
      <circle cx="60" cy="62" r="3" fill="#ff4081" filter="url(#glow)">
        <animate attributeName="r" values="2; 4; 2" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="90" cy="52" r="4.5" fill="#ffffff" filter="url(#glow-heavy)">
        <animate attributeName="r" values="3.5; 6; 3.5" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="120" cy="62" r="3" fill="#ff4081" filter="url(#glow)">
        <animate attributeName="r" values="2; 4; 2" dur="1.2s" repeatCount="indefinite" delay="0.6s"/>
      </circle>

      <!-- Purple diamond at the bottom point of shield -->
      <polygon points="90,128 96,134 90,140 84,134" fill="#ea80fc" filter="url(#glow)">
         <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
      </polygon>

      <!-- Static Shine Reflection on the Shield -->
      <path d="M 45 35 L 80 35 L 45 80 Z" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- ========================================== -->
    <!-- 6. MAGIC DUST / RISING GLOWING ORBS (New in SVIP 4) -->
    <!-- ========================================== -->
    <!-- Particle 1 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="30 150; 30 -10" dur="3s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="3" fill="#e040fb" filter="url(#glow)">
        <animate attributeName="opacity" values="0; 1; 0" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Particle 2 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="160 140; 160 -20" dur="2.5s" repeatCount="indefinite" delay="0.5s"/>
      <circle cx="0" cy="0" r="4" fill="#fff59d" filter="url(#glow)">
        <animate attributeName="opacity" values="0; 1; 0" dur="2.5s" repeatCount="indefinite" delay="0.5s"/>
      </circle>
    </g>
    <!-- Particle 3 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="240 160; 240 10" dur="3.5s" repeatCount="indefinite" delay="1s"/>
      <circle cx="0" cy="0" r="2.5" fill="#ea80fc" filter="url(#glow)">
        <animate attributeName="opacity" values="0; 1; 0" dur="3.5s" repeatCount="indefinite" delay="1s"/>
      </circle>
    </g>
    <!-- Particle 4 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="400 130; 400 -30" dur="2.8s" repeatCount="indefinite" delay="1.5s"/>
      <circle cx="0" cy="0" r="3.5" fill="#fff59d" filter="url(#glow)">
        <animate attributeName="opacity" values="0; 1; 0" dur="2.8s" repeatCount="indefinite" delay="1.5s"/>
      </circle>
    </g>

    <!-- Few Sparkles -->
    <use href="#sparkle" x="140" y="20">
      <animateTransform attributeName="transform" type="rotate" values="0 140 20; 90 140 20" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" dur="2.5s" repeatCount="indefinite"/>
    </use>

  </g>
</svg>