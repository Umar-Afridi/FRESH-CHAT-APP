<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow1"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <!-- Outer Rotating Dashed Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="10 15" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- Main Solid Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow1)"/>
  <!-- Inner White Trim -->
  <circle cx="100" cy="100" r="73" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <!-- Floating Orbs -->
  <circle cx="100" cy="20" r="3" fill="#60A5FA" filter="url(#glow1)">
    <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="180" r="3" fill="#60A5FA" filter="url(#glow1)">
    <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>