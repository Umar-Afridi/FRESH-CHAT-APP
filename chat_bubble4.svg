<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Purple Gradient for Chat Bubble Base -->
    <linearGradient id="purpleBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#4b0082"/>
      <stop offset="100%" stop-color="#2e004f"/>
    </linearGradient>

    <!-- Glowing Magenta/Pinkish Border Gradient -->
    <linearGradient id="magentaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff66ff"/>
      <stop offset="40%" stop-color="#d400ff"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>

    <!-- Realistic 3D Gold Gradient for Crown & Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="20%" stop-color="#ffaa00"/>
      <stop offset="50%" stop-color="#cc7700"/>
      <stop offset="80%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#804000"/>
    </linearGradient>

    <!-- Purple Gem/Diamond Gradient -->
    <linearGradient id="purpleGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff99ff"/>
      <stop offset="40%" stop-color="#d400ff"/>
      <stop offset="100%" stop-color="#6600cc"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Pop Effect -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="elementShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    
    <!-- Outer Glow for Sparkles and Neon Edges -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkling Star Shape -->
    <g id="star">
      <path d="M0,-15 Q0,0 15,0 Q0,0 0,15 Q0,0 -15,0 Q0,0 0,-15 Z" fill="#ffffff" filter="url(#glowEffect)"/>
    </g>
  </defs>

  <style>
    /* BUBBLE IS FIXED - ONLY STARS BLINK TO GIVE A PREMIUM FEEL */
    .twinkle1 { animation: blink 2s infinite alternate ease-in-out; }
    .twinkle2 { animation: blink 2.5s infinite alternate ease-in-out 0.5s; }
    .twinkle3 { animation: blink 1.8s infinite alternate ease-in-out 1s; }
    .twinkle4 { animation: blink 3s infinite alternate ease-in-out 0.2s; }
    
    @keyframes blink {
      0% { opacity: 0.1; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- BACKGROUND SPARKLES (Animated but keep their position fixed) -->
  <g transform="translate(110, 70)">
    <use href="#star" class="twinkle1" transform="scale(0.8)"/>
  </g>
  <g transform="translate(430, 100)">
    <use href="#star" class="twinkle2" transform="scale(1.1)"/>
  </g>
  <g transform="translate(420, 280)">
    <use href="#star" class="twinkle3" transform="scale(0.9)"/>
  </g>
  <g transform="translate(170, 240)">
    <circle cx="0" cy="0" r="2.5" fill="#fff" class="twinkle4" filter="url(#glowEffect)"/>
  </g>

  <!-- ========================================== -->
  <!-- MAIN CHAT BUBBLE (FIXED POSITION) -->
  <!-- ========================================== -->
  <g filter="url(#boxShadow)">
    <!-- Glowing Magenta Outer Edge -->
    <rect x="117" y="97" width="266" height="136" rx="18" fill="url(#magentaBorder)" filter="url(#glowEffect)" opacity="0.6"/>
    
    <!-- Base Purple Rectangle -->
    <rect x="120" y="100" width="260" height="130" rx="15" fill="url(#purpleBase)" stroke="url(#magentaBorder)" stroke-width="4"/>
    
    <!-- Inner Glassy Highlight (Shine) -->
    <rect x="123" y="103" width="254" height="60" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="122" y="102" width="256" height="126" rx="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Top Right Fold Ribbon (Purple Ribbon) -->
    <path d="M350,100 L380,100 Q395,100 390,120 Q370,110 350,100 Z" fill="url(#purpleGem)" filter="url(#elementShadow)"/>
    <path d="M360,105 Q370,110 380,110" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- ========================================== -->
  <!-- EXTERNAL DECORATIONS -->
  <!-- ========================================== -->

  <!-- Top Left Diamond Gem (Purple Amethyst) -->
  <g transform="translate(120, 100)" filter="url(#elementShadow)">
    <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#purpleGem)" stroke="#ff99ff" stroke-width="2"/>
    <!-- Facets -->
    <polygon points="0,-16 16,0 0,0 -16,0" fill="#ffffff" opacity="0.5"/>
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Bottom Left Wing & Gold Curve -->
  <g transform="translate(120, 230)" filter="url(#elementShadow)">
    <!-- Gold Hook/Swoop -->
    <path d="M -10,-10 C -20,30 30,50 60,10 C 30,30 -5,20 5,-15 Z" fill="url(#goldGrad)"/>
    <path d="M -5,5 C 0,20 20,30 40,15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Purple Leaf/Fin Wing over the Gold -->
    <path d="M -15,-40 Q -30,0 5,15 Q -10,0 -5,-30 Z" fill="url(#purpleGem)"/>
    <!-- Inner bright line for fin -->
    <path d="M -10,-30 Q -15,-5 0,5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Bottom Right 3D Royal Crown (With Purple Velvet Inside) -->
  <g transform="translate(370, 220) rotate(-10)" filter="url(#elementShadow)">
    
    <!-- Purple Velvet Cushion inside the Crown (New Addition based on your image) -->
    <path d="M-25,-5 Q-15,-30 -5,-5 Q5,-30 15,-5 Q25,-30 35,-5 L30,20 L-20,20 Z" fill="#d400ff"/>
    <path d="M-20,0 Q-10,-20 0,0 Q10,-20 20,0 Q30,-20 30,0 L25,20 L-15,20 Z" fill="#8a2be2"/>

    <!-- Gold Crown Base & Spikes -->
    <path d="M-30,-10 L-20,20 L30,20 L40,-10 L20,5 L5,-20 L-10,5 Z" fill="url(#goldGrad)"/>
    <!-- Crown 3D Depth Shade -->
    <path d="M-25,-5 L-20,20 L30,20 L35,-5 L20,10 L5,-10 L-10,10 Z" fill="#995500" opacity="0.6"/>
    
    <!-- Crown Bottom Rim -->
    <rect x="-22" y="18" width="54" height="6" rx="3" fill="url(#goldGrad)"/>
    <rect x="-22" y="18" width="54" height="2" fill="#ffffff" opacity="0.5"/>

    <!-- Jewels on the crown peaks -->
    <circle cx="-30" cy="-10" r="3.5" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="5" cy="-20" r="4" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="40" cy="-10" r="3.5" fill="#ffffff" filter="url(#glowEffect)"/>
    
    <!-- Jewels on the Crown Rim -->
    <circle cx="-10" cy="21" r="1.5" fill="#ff33ff"/>
    <circle cx="5" cy="21" r="2" fill="#ff33ff"/>
    <circle cx="20" cy="21" r="1.5" fill="#ff33ff"/>
  </g>

  <!-- ========================================== -->
  <!-- TEXT (HELLO) -->
  <!-- ========================================== -->
  <!-- Fixed Text, properly centered -->
  <text x="250" y="180" font-family="'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">Hello</text>

  <!-- Extra small glow dots around the text -->
  <circle cx="170" cy="150" r="1.5" fill="#ffffff" class="twinkle1"/>
  <circle cx="330" cy="185" r="2" fill="#ff99ff" class="twinkle3"/>

</svg>