<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 1. Main Banner Gradients (Blue-Green / Teal to Neon Green) -->
        <linearGradient id="mainBgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#004D40" />  <!-- Deep Teal/Blue-Green -->
            <stop offset="50%" stop-color="#00897B" /> <!-- Medium Teal -->
            <stop offset="80%" stop-color="#00E676" /> <!-- Bright Neon Green -->
            <stop offset="100%" stop-color="#00BFA5" /> <!-- Bright Blue-Green -->
        </linearGradient>

        <!-- 2. Metallic Silver/White for Top Frame (Remains same for metallic contrast) -->
        <linearGradient id="silverFrame" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#C5F0E3" /> <!-- Slight green tint in silver -->
            <stop offset="100%" stop-color="#709E91" />
        </linearGradient>

        <linearGradient id="darkInner" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00332E" /> <!-- Dark Blue-Green base -->
            <stop offset="100%" stop-color="#001410" />
        </linearGradient>

        <!-- 3. Neon Green/Cyan for Accents & Diamonds -->
        <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00FFCC" /> <!-- Neon Cyan/Blue-Green -->
            <stop offset="50%" stop-color="#00FF66" /> <!-- Neon Green -->
            <stop offset="100%" stop-color="#009933" /> <!-- Deep Green -->
        </linearGradient>

        <!-- 4. Gold Gradient for 'Go' Button (Gold looks best with Green) -->
        <linearGradient id="goldBtn" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF3CD" />
            <stop offset="50%" stop-color="#F6D365" />
            <stop offset="100%" stop-color="#EDA332" />
        </linearGradient>

        <!-- 5. Filters for Glow and Shadow -->
        <filter id="neonGlow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="dropShadow">
            <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
        </filter>

        <filter id="greenGlow">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FFCC" flood-opacity="0.8"/>
        </filter>

        <!-- 6. Shine Mask -->
        <clipPath id="shineClip">
            <rect x="50" y="110" width="1000" height="130" rx="10" />
        </clipPath>
        <linearGradient id="shineLight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.7)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>

        <!-- ========================================== -->
        <!--  MASTER REUSABLE GEOMETRIC WING (Right)    -->
        <!-- ========================================== -->
        <g id="wing-half" filter="url(#dropShadow)">
            <!-- Outer Thick Silver Frame -->
            <path d="M 45 40 L 120 40 L 150 20 L 450 20 L 470 -25 L 170 -25 L 130 15 L 60 15 Z" fill="url(#silverFrame)"/>
            
            <!-- Sharp Downward Silver Spike -->
            <path d="M 45 40 L 80 80 L 105 40 Z" fill="url(#silverFrame)"/>

            <!-- Inner Dark Blue-Green Base -->
            <path d="M 50 35 L 115 35 L 145 15 L 440 15 L 455 -20 L 175 -20 L 135 10 L 65 10 Z" fill="url(#darkInner)"/>
            <path d="M 50 35 L 80 70 L 100 35 Z" fill="url(#darkInner)"/>

            <!-- Neon Green/Cyan Angled Accents -->
            <path d="M 190 15 L 230 15 L 210 -20 L 175 -20 Z" fill="url(#neonGreen)" filter="url(#neonGlow)"/>
            <path d="M 240 15 L 260 15 L 240 -20 L 220 -20 Z" fill="url(#neonGreen)"/>

            <!-- The Large Green/Cyan Diamond -->
            <g transform="translate(360, -5)">
                <polygon points="0,-25 25,0 0,25 -25,0" fill="url(#neonGreen)" filter="url(#greenGlow)"/>
                <polygon points="0,-15 15,0 0,15 -15,0" fill="#FFFFFF"/>
                <!-- Diamond Sparkle -->
                <path d="M 0,-30 L 2,-5 L 30,0 L 2,5 L 0,30 L -2,5 L -30,0 L -2,-5 Z" fill="#FFFFFF" transform="scale(0.6)"/>
            </g>
        </g>

        <!-- Star Shape -->
        <path id="star" d="M 0,-8 L 1.5,-2 L 8,0 L 1.5,2 L 0,8 L -1.5,2 L -8,0 L -1.5,-2 Z" fill="#FFFFFF" filter="drop-shadow(0 0 3px #FFF)"/>
    </defs>

    <style>
        /* CSS ANIMATIONS */
        @keyframes sweep {
            0% { transform: translateX(-200px) skewX(-25deg); }
            100% { transform: translateX(1200px) skewX(-25deg); }
        }
        @keyframes twinkle {
            0%, 100% { transform: scale(0.5); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 5px #00FFCC); }
            50% { filter: drop-shadow(0 0 15px #00FFCC); }
        }
        @keyframes lightningStrike {
            0%, 95%, 100% { opacity: 0.1; }
            96%, 98% { opacity: 0.8; }
        }

        .shine-box { animation: sweep 3.5s infinite ease-in-out; }
        .st1 { animation: twinkle 1.5s infinite ease-in-out; }
        .st2 { animation: twinkle 2s infinite ease-in-out 0.5s; }
        .st3 { animation: twinkle 1.8s infinite ease-in-out 1s; }
        .pulse-circle { animation: pulseGlow 2s infinite ease-in-out; }
        .lightning { animation: lightningStrike 4s infinite linear; }
    </style>

    <!-- ================== MAIN BACKGROUND BANNER (Lower Part) ================== -->
    <!-- Base Rectangle -->
    <rect x="50" y="110" width="1000" height="130" rx="15" fill="url(#mainBgGrad)" filter="url(#dropShadow)"/>
    
    <!-- Top thin glowing line on the rectangle (Cyan) -->
    <rect x="50" y="110" width="1000" height="4" rx="2" fill="#85FFD6" opacity="0.8"/>

    <!-- Lightning Effects in Background (Subtle Neon Green/Cyan) -->
    <g class="lightning" fill="none" stroke="#66FFCC" stroke-width="1.5">
        <path d="M 150 110 L 180 140 L 160 170 L 220 220" />
        <path d="M 300 240 L 330 200 L 310 160 L 380 110" />
        <path d="M 700 110 L 680 160 L 720 190 L 690 240" />
    </g>

    <!-- Shine Animation Layer -->
    <g clip-path="url(#shineClip)">
        <rect class="shine-box" x="0" y="0" width="150" height="300" fill="url(#shineLight)" />
    </g>

    <!-- ================== GEOMETRIC TOP FRAME ================== -->
    <!-- Centered at X=550, Y=80 -->
    <g transform="translate(550, 80)">
        
        <!-- Right Wing -->
        <use href="#wing-half" />
        <!-- Left Wing (Mirrored) -->
        <use href="#wing-half" transform="scale(-1, 1)" />

        <!-- ================== CENTER BADGE ("1") ================== -->
        <!-- Outer Glowing Ring -->
        <circle cx="0" cy="0" r="45" fill="url(#darkInner)" stroke="url(#neonGreen)" stroke-width="6" class="pulse-circle"/>
        
        <!-- Inner Silver Ring -->
        <circle cx="0" cy="0" r="38" fill="none" stroke="url(#silverFrame)" stroke-width="2"/>
        
        <!-- Deep Center Background -->
        <circle cx="0" cy="0" r="32" fill="#001F1A" />

        <!-- The Number "1" -->
        <text x="-2" y="15" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" filter="url(#greenGlow)" text-anchor="middle">1</text>
        <!-- Overlay Text to make center bright white -->
        <text x="-2" y="15" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">1</text>

    </g>

    <!-- ================== "GO" BUTTON ================== -->
    <!-- Positioned on the right side of the main banner -->
    <rect x="860" y="145" width="140" height="60" rx="30" fill="url(#goldBtn)" filter="url(#dropShadow)"/>
    <text x="930" y="185" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#5A2E00" text-anchor="middle">Go</text>


    <!-- ================== FLOATING STARS / SPARKLES ================== -->
    <use href="#star" x="90" y="90" class="st1" />
    <use href="#star" x="250" y="210" class="st2" />
    <use href="#star" x="420" y="70" class="st3" />
    <use href="#star" x="680" y="220" class="st1" />
    <use href="#star" x="820" y="80" class="st2" />
    <use href="#star" x="1020" y="130" class="st3" />

</svg>