<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="sv2-siBase" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40454a"/><stop offset="50%" stop-color="#a0a5ab"/><stop offset="100%" stop-color="#1a1c1e"/>
    </linearGradient>
    <linearGradient id="sv2-siHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#d0d5da"/><stop offset="100%" stop-color="#70757a"/>
    </linearGradient>
    <linearGradient id="sv2-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0ffff"/><stop offset="100%" stop-color="#4682b4"/>
    </linearGradient>
    <filter id="sv2-sh"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/></filter>
    <filter id="sv2-gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="sv2-emb">
      <ellipse cx="0" cy="0" rx="2.5" ry="12" fill="#00bfff" filter="url(#sv2-gl)" opacity="0.9"/>
      <circle cx="0" cy="0" r="1.5" fill="#fff"/>
    </g>
  </defs>
  <style>
    .sv2-wL { transform-origin: 300px 170px; animation: sv2wL 3.5s ease-in-out infinite alternate; }
    .sv2-wR { transform-origin: 300px 170px; animation: sv2wR 3.5s ease-in-out infinite alternate; }
    @keyframes sv2wL { 0% { transform: rotate(0deg); } 100% { transform: rotate(-5deg); } }
    @keyframes sv2wR { 0% { transform: rotate(0deg); } 100% { transform: rotate(5deg); } }
    @keyframes sv2flyL { 0%{transform:translate(130px,590px) scale(0);opacity:0;} 50%{opacity:1;transform:translate(180px,330px) scale(1) rotate(25deg);} 100%{transform:translate(240px,90px) scale(0) rotate(45deg);opacity:0;} }
    @keyframes sv2flyR { 0%{transform:translate(470px,590px) scale(0);opacity:0;} 50%{opacity:1;transform:translate(420px,330px) scale(1) rotate(-25deg);} 100%{transform:translate(360px,90px) scale(0) rotate(-45deg);opacity:0;} }
    .sv2-el1 { animation: sv2flyL 2.8s infinite ease-in; }
    .sv2-er1 { animation: sv2flyR 3.2s infinite ease-in 0.8s; }
    .sv2-el2 { animation: sv2flyL 2.5s infinite ease-in 1.5s; }
  </style>

  <!-- Ice Wings with Wind -->
  <g filter="url(#sv2-sh)">
    <path class="sv2-wL" d="M300,170 Q150,120 100,50 Q160,90 240,150 Z" fill="url(#sv2-wing)"/>
    <path class="sv2-wR" d="M300,170 Q450,120 500,50 Q440,90 360,150 Z" fill="url(#sv2-wing)"/>
  </g>

  <!-- Silver Frame -->
  <circle cx="300" cy="350" r="190" fill="none" stroke="#151719" stroke-width="25" filter="url(#sv2-sh)"/>
  <circle cx="300" cy="350" r="190" fill="none" stroke="url(#sv2-siHigh)" stroke-width="15"/>
  <circle cx="300" cy="350" r="175" fill="none" stroke="url(#sv2-siBase)" stroke-width="4"/>

  <!-- Sharp Crown -->
  <path d="M240,150 L260,80 L300,130 L340,80 L360,150 Z" fill="url(#sv2-siHigh)" filter="url(#sv2-sh)"/>
  <circle cx="300" cy="70" r="8" fill="#00bfff" filter="url(#sv2-gl)"/>

  <!-- Hexagon Nameplate -->
  <g filter="url(#sv2-sh)">
    <polygon points="170,520 430,520 450,550 430,580 170,580 150,550" fill="#0b0d0f" stroke="url(#sv2-siHigh)" stroke-width="6"/>
  </g>

  <!-- Sparks over frame -->
  <g opacity="0.9">
    <use href="#sv2-emb" class="sv2-el1"/><use href="#sv2-emb" class="sv2-er1"/><use href="#sv2-emb" class="sv2-el2"/>
  </g>

  <text x="300" y="563" font-family="'Trebuchet MS', sans-serif" font-size="34" font-weight="900" fill="url(#sv2-siHigh)" text-anchor="middle" letter-spacing="4">SVIP 2</text>
</svg>