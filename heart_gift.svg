<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Master Path for the Plump Heart -->
    <path id="heartPath" d="M 250, 440 C 90, 280 30, 180 30, 130 C 30, 60 90, 30 150, 30 C 200, 30 230, 60 250, 90 C 270, 60 300, 30 350, 30 C 410, 30 470, 60 470, 130 C 470, 180 410, 280 250, 440 Z" />

    <!-- 3D Base Gradient for the Heart (Bright Pinkish-Red to Deep Maroon) -->
    <radialGradient id="heartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="15%" stop-color="#ff0040" />
      <stop offset="50%" stop-color="#cc0022" />
      <stop offset="85%" stop-color="#660011" />
      <stop offset="100%" stop-color="#330008" />
    </radialGradient>

    <!-- Super Bright Chamak (Animated Shine Strip) -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Premium Drop Shadow for transparent background -->
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ff0040" flood-opacity="0.4"/>
    </filter>

    <!-- Star Twinkle Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blur for 3D Glossy Wet Highlights -->
    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="heavy-blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Clip Path for the Chamak Strip to stay inside the heart -->
    <clipPath id="heartClip">
      <use href="#heartPath" />
    </clipPath>
  </defs>

  <!-- Animated Beating/Pulsing Group -->
  <g transform-origin="250 250">
    <!-- Heartbeat Animation -->
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="1; 1.07; 1; 1.04; 1; 1" 
      keyTimes="0; 0.1; 0.25; 0.4; 0.55; 1" 
      dur="1.8s" 
      repeatCount="indefinite" 
    />

    <!-- Main Heart Shape with Drop Shadow and 3D Gradient -->
    <use href="#heartPath" fill="url(#heartGrad)" filter="url(#drop-shadow)" />

    <!-- Inner Dark Shadow for 3D edge depth -->
    <use href="#heartPath" fill="none" stroke="#2a0007" stroke-width="18" opacity="0.4" filter="url(#soft-blur)" />

    <!-- Inner Light Rim (Bounce Light) -->
    <use href="#heartPath" fill="none" stroke="#ff80a6" stroke-width="6" opacity="0.6" filter="url(#soft-blur)" />

    <!-- 3D Wet/Glossy Specular Highlights -->
    <!-- Large Left Highlight -->
    <path d="M 60, 130 C 60, 70 120, 45 160, 45 C 190, 45 210, 55 210, 55 C 170, 75 90, 130 90, 220 C 90, 220 60, 180 60, 130 Z" fill="#ffffff" opacity="0.65" filter="url(#soft-blur)" />
    
    <!-- Small Right Highlight -->
    <path d="M 380, 50 C 420, 60 440, 90 440, 130 C 440, 150 430, 170 430, 170 C 430, 170 410, 100 350, 70 C 350, 70 365, 50 380, 50 Z" fill="#ffffff" opacity="0.4" filter="url(#soft-blur)" />
    
    <!-- Center Plump Highlight (Adds Extreme 3D Depth) -->
    <ellipse cx="170" cy="120" rx="30" ry="15" transform="rotate(-30 170 120)" fill="#ffffff" opacity="0.5" filter="url(#soft-blur)" />
    <ellipse cx="330" cy="100" rx="20" ry="10" transform="rotate(30 330 100)" fill="#ffffff" opacity="0.3" filter="url(#soft-blur)" />

    <!-- Bottom Bounce Light (Reflection) -->
    <path d="M 200, 400 C 230, 430 270, 430 300, 400 C 270, 415 230, 415 200, 400 Z" fill="#ffb3cc" opacity="0.5" filter="url(#soft-blur)" />

    <!-- The Running Chamak Patti (Animated Shine Effect) -->
    <g clip-path="url(#heartClip)">
      <rect x="-300" y="-50" width="70" height="550" fill="url(#shineGrad)" transform="skewX(-25)">
        <animate attributeName="x" from="-350" to="650" dur="2s" repeatCount="indefinite" />
      </rect>
      <!-- Secondary thinner shine -->
      <rect x="-180" y="-50" width="15" height="550" fill="url(#shineGrad)" transform="skewX(-25)">
        <animate attributeName="x" from="-230" to="770" dur="2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Sparkling / Twinkling Glowing Stars -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Top Right Star -->
    <g transform="translate(410, 50)">
      <path d="M 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Q 15 15 15 0 Z">
        <animateTransform attributeName="transform" type="scale" values="0.5; 1.5; 0.5" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.5s" repeatCount="indefinite" />
      </path>
      <circle cx="15" cy="15" r="2" fill="#fff" />
    </g>

    <!-- Top Left Star -->
    <g transform="translate(60, 70)">
      <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z" fill="#ffb3c6">
        <animateTransform attributeName="transform" type="scale" values="0.7; 1.3; 0.7" dur="2.1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.1s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Bottom Left Star -->
    <g transform="translate(90, 360)">
      <path d="M 10 0 Q 10 10 20 10 Q 10 10 10 20 Q 10 10 0 10 Q 10 10 10 0 Z">
        <animateTransform attributeName="transform" type="scale" values="0.4; 1.1; 0.4" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 0.8; 0.1" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Bottom Right Star -->
    <g transform="translate(390, 320)">
      <path d="M 14 0 Q 14 14 28 14 Q 14 14 14 28 Q 14 14 0 14 Q 14 14 14 0 Z" fill="#ffccd5">
        <animateTransform attributeName="transform" type="scale" values="0.6; 1.4; 0.6" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="1.8s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>