<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Extremely Bright & Shiny Gold Gradient -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="75%" stop-color="#FFFBEA"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Solid Rich Gold for Base & Depth -->
    <linearGradient id="gold-solid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="80%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Dark Brown/Gold for Inner Banner Contrast -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2E00"/>
      <stop offset="50%" stop-color="#7A4B00"/>
      <stop offset="100%" stop-color="#2D1C00"/>
    </linearGradient>

    <!-- Strong Golden Glow Filter -->
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Drop Shadow -->
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- ================= ROTATING GOLDEN SUNRAYS (Background) ================= -->
  <!-- Center is totally empty, rays only on the edges -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#gold-bright)" stroke-width="12" stroke-dasharray="8 20" opacity="0.75" filter="url(#glow-gold)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="15s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gold-solid)" stroke-width="4" stroke-dasharray="30 15" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- ================= THICK MAIN INNER RINGS (Frames the DP cleanly) ================= -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="url(#gold-solid)" stroke-width="6" filter="url(#drop-shadow)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" filter="url(#glow-gold)"/>
  <circle cx="100" cy="100" r="77" fill="none" stroke="#7A4B00" stroke-width="1"/>


  <!-- ================= MASSIVE SIDE GOLDEN BLADES (Breathing Animation) ================= -->
  <g filter="url(#drop-shadow)">
    <!-- Scale animation to make the blades "breathe" outwards -->
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.04 1; 1 1" transform-origin="100 100" dur="2s" repeatCount="indefinite" ease="in-out"/>
    
    <!-- LEFT SIDE BLADES -->
    <!-- Back Darker Blade -->
    <path d="M 22 130 C 0 80 20 30 50 15 C 30 50 28 90 32 130 Z" fill="url(#gold-solid)"/>
    <!-- Front Bright Shiny Blade -->
    <path d="M 12 110 C -5 60 10 20 40 5 C 15 40 18 70 22 110 Z" fill="url(#gold-bright)"/>
    <!-- Decor Detail -->
    <path d="M 25 100 C 10 60 20 30 45 15" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

    <!-- RIGHT SIDE BLADES -->
    <!-- Back Darker Blade -->
    <path d="M 178 130 C 200 80 180 30 150 15 C 170 50 172 90 168 130 Z" fill="url(#gold-solid)"/>
    <!-- Front Bright Shiny Blade -->
    <path d="M 188 110 C 205 60 190 20 160 5 C 185 40 182 70 178 110 Z" fill="url(#gold-bright)"/>
    <!-- Decor Detail -->
    <path d="M 175 100 C 190 60 180 30 155 15" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  </g>


  <!-- ================= BOTTOM "OFFICIAL" HEAVY PLAQUE (100% STATIC/FIXED) ================= -->
  <g filter="url(#drop-shadow)">
    <!-- Outer Massive Solid Gold Plate -->
    <path d="M 10 148 L 190 148 L 175 188 L 25 188 Z" fill="url(#gold-solid)"/>
    
    <!-- Inner Dark Chocolate/Gold Plate (Creates contrast for text) -->
    <path d="M 16 152 L 184 152 L 171 184 L 29 184 Z" fill="url(#gold-dark)"/>
    
    <!-- Inner Bright Glowing Border -->
    <path d="M 20 155 L 180 155 L 169 181 L 31 181 Z" fill="none" stroke="url(#gold-bright)" stroke-width="2" filter="url(#glow-gold)"/>

    <!-- Corner Golden Diamonds -->
    <polygon points="32,168 36,164 40,168 36,172" fill="#FFFFFF" filter="url(#glow-gold)"/>
    <polygon points="168,168 172,164 176,168 172,172" fill="#FFFFFF" filter="url(#glow-gold)"/>

    <!-- OFFICIAL Bold Text -->
    <text x="100" y="170" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="20" fill="url(#gold-bright)" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">
      OFFICIAL
      <!-- Ultra-Shiny Text Color Animation (Text does NOT move) -->
      <animate attributeName="fill" values="#FFE600; #FFFFFF; #FFB300; #FFE600" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>


  <!-- ================= GLOWING GOLDEN SPARKS (Flying Upwards) ================= -->
  <!-- These replace the fire, giving a luxurious magical golden vibe -->
  <g filter="url(#glow-gold)">
    <!-- Spark 1 -->
    <circle cx="30" cy="140" r="3" fill="#FFFFFF">
       <animate attributeName="cy" values="140; 50" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="cx" values="30; 15; 35; 20" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Spark 2 -->
    <circle cx="170" cy="140" r="3" fill="#FFE600">
       <animate attributeName="cy" values="140; 50" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
       <animate attributeName="cx" values="170; 185; 165; 180" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Spark 3 -->
    <circle cx="45" cy="130" r="2" fill="#FFB300">
       <animate attributeName="cy" values="130; 30" dur="1.8s" repeatCount="indefinite" begin="1s"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="1.8s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <!-- Spark 4 -->
    <circle cx="155" cy="130" r="2" fill="#FFFFFF">
       <animate attributeName="cy" values="130; 30" dur="1.6s" repeatCount="indefinite" begin="1.2s"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="1.6s" repeatCount="indefinite" begin="1.2s"/>
    </circle>

    <!-- Large Spark 5 -->
    <circle cx="20" cy="145" r="4" fill="#FFE600">
       <animate attributeName="cy" values="145; 70" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
       <animate attributeName="opacity" values="0; 0.8; 0" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Large Spark 6 -->
    <circle cx="180" cy="145" r="4" fill="#FFE600">
       <animate attributeName="cy" values="145; 70" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
       <animate attributeName="opacity" values="0; 0.8; 0" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
</svg>