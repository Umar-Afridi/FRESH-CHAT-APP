
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0" />
      <stop offset="40%" stop-color="#ffe0b2" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>

    <!-- Normal Peach Glow for LV.2 -->
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffccbc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffccbc" stop-opacity="0"/>
    </radialGradient>

