<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Frame -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7b0"/>
      <stop offset="20%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="80%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fff7b0"/>
    </linearGradient>
    
    <!-- Purple Gradient for Feathers/Leaves -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rotating Back Aura (Speed reduced from 4s to 7s) -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#purple-grad)" stroke-width="2.5" stroke-dasharray="15 20" opacity="0.9" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing Main Gold Base Rings (Medium Speed) -->
  <g>
    <circle cx="100" cy="100" r="76" fill="none" stroke="url(#gold-grad)" stroke-width="5" filter="url(#glow)">
        <animate attributeName="stroke-width" values="4; 7; 4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#fff7b0" stroke-width="1.5" opacity="0.8">
        <animate attributeName="r" values="68; 72; 68" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="1">
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Feathers/Leaves Left Side (Flapping Speed: 2s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 100 100; 10 100 100; 0 100 100" dur="2s" repeatCount="indefinite" ease="in-out"/>
    <!-- Purple Feathers -->
    <path d="M 22 100 Q 5 60 38 40 Q 30 75 26 100 Z" fill="url(#purple-grad)"/>
    <path d="M 20 125 Q 0 95 25 75 Q 26 105 24 125 Z" fill="url(#purple-grad)"/>
    <path d="M 30 145 Q 5 115 35 95 Q 36 125 34 145 Z" fill="url(#purple-grad)" opacity="0.9"/>
    <!-- Gold Accents -->
    <path d="M 35 155 Q 10 130 25 105 Q 35 130 40 155 Z" fill="url(#gold-grad)"/>
    <path d="M 45 40 Q 20 20 60 15 Q 50 30 45 40 Z" fill="url(#gold-grad)"/>
  </g>

  <!-- Animated Feathers/Leaves Right Side (Flapping Speed: 2s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 100 100; -10 100 100; 0 100 100" dur="2s" repeatCount="indefinite" ease="in-out"/>
    <!-- Purple Feathers -->
    <path d="M 178 100 Q 195 60 162 40 Q 170 75 174 100 Z" fill="url(#purple-grad)"/>
    <path d="M 180 125 Q 200 95 175 75 Q 174 105 176 125 Z" fill="url(#purple-grad)"/>
    <path d="M 170 145 Q 195 115 165 95 Q 164 125 166 145 Z" fill="url(#purple-grad)" opacity="0.9"/>
    <!-- Gold Accents -->
    <path d="M 165 155 Q 190 130 175 105 Q 165 130 160 155 Z" fill="url(#gold-grad)"/>
    <path d="M 155 40 Q 180 20 140 15 Q 150 30 155 40 Z" fill="url(#gold-grad)"/>
  </g>

  <!-- Top Crown / Bouncing White Diamond (Medium Speed) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="1.5s" repeatCount="indefinite"/>
    <path d="M 60 25 Q 100 -5 140 25 Q 100 15 60 25 Z" fill="url(#gold-grad)"/>
    <polygon points="100,2 120,22 100,42 80,22" fill="#ffffff" stroke="url(#gold-grad)" stroke-width="3" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Bottom Crest / Beating Purple Jewel (Medium Speed) -->
  <g>
    <animateTransform attributeName="transform" type="scale" values="1; 1.08; 1" transform-origin="100 165" dur="1.2s" repeatCount="indefinite"/>
    <!-- Gold Base Housing -->
    <path d="M 55 165 Q 100 135 145 165 Q 100 210 55 165 Z" fill="url(#gold-grad)" filter="url(#glow)"/>
    <path d="M 75 150 Q 100 185 125 150 Z" fill="url(#gold-grad)"/>
    
    <!-- Purple Jewel -->
    <polygon points="100,143 125,165 100,190 75,165" fill="url(#purple-grad)" stroke="#fff" stroke-width="2.5">
      <animate filter="url(#glow)" attributeName="opacity" values="0.6; 1; 0.6" dur="0.8s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Jewel Sparkle (Blinking dot) -->
    <circle cx="100" cy="165" r="4" fill="#ffffff" filter="url(#glow)">
        <animate attributeName="opacity" values="0; 1; 0" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Particles/Aura (Medium Speed) -->
  <g>
    <circle cx="45" cy="45" r="3" fill="#ffffff" filter="url(#glow)">
       <animate attributeName="cy" values="45; 15; 45" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="cx" values="45; 35; 45" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="155" cy="65" r="3" fill="#d8b4fe" filter="url(#glow)">
       <animate attributeName="cy" values="65; 30; 65" dur="1.8s" repeatCount="indefinite"/>
       <animate attributeName="cx" values="155; 170; 155" dur="1.8s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="35" cy="140" r="3" fill="#facc15" filter="url(#glow)">
       <animate attributeName="cy" values="140; 110; 140" dur="2.5s" repeatCount="indefinite"/>
       <animate attributeName="cx" values="35; 15; 35" dur="2.5s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="165" cy="140" r="3.5" fill="#ffffff" filter="url(#glow)">
       <animate attributeName="cy" values="140; 100; 140" dur="2.2s" repeatCount="indefinite"/>
       <animate attributeName="cx" values="165; 185; 165" dur="2.2s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="100" cy="20" r="4" fill="#facc15" filter="url(#glow)">
       <animate attributeName="cy" values="20; -10; 20" dur="1.5s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0; 1; 0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>