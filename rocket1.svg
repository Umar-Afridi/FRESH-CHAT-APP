<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -600 1400 2400" width="100%" height="100%" style="overflow: visible; background-color: transparent;">
  <defs>
    <!-- GREEN ROCKET AURA -->
    <radialGradient id="rocketAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF00" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#009900" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#003300" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- GREEN BODY GRADIENTS -->
    <linearGradient id="greenBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003300" />
      <stop offset="15%" stop-color="#00CC00" />
      <stop offset="50%" stop-color="#88FF88" />
      <stop offset="85%" stop-color="#00CC00" />
      <stop offset="100%" stop-color="#002200" />
    </linearGradient>

    <linearGradient id="greenDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001A00" />
      <stop offset="50%" stop-color="#006600" />
      <stop offset="100%" stop-color="#001A00" />
    </linearGradient>

    <!-- GREEN GEM -->
    <radialGradient id="greenGem" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#99FF99" />
      <stop offset="50%" stop-color="#00CC00" />
      <stop offset="80%" stop-color="#006600" />
      <stop offset="100%" stop-color="#002200" />
    </radialGradient>
    
    <!-- GOLD GRADIENTS (Kept for accents) -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805500" />
      <stop offset="20%" stop-color="#FFCC00" />
      <stop offset="50%" stop-color="#FFFF88" />
      <stop offset="80%" stop-color="#FFaa00" />
      <stop offset="100%" stop-color="#664400" />
    </linearGradient>

    <linearGradient id="goldVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFF88" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#995500" />
    </linearGradient>

    <!-- GREEN FLAME GRADIENT -->
    <linearGradient id="flameGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#99FF99" />
      <stop offset="70%" stop-color="#00CC00" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- FILTERS -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- REUSABLE SPARK/STAR -->
    <g id="star">
      <circle cx="0" cy="0" r="4" fill="#FFF" filter="url(#glow)">
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="1; 1.5; 1" dur="1s" repeatCount="indefinite" />
      </circle>
      <path d="M 0,-12 L 2,-2 L 12,0 L 2,2 L 0,12 L -2,2 L -12,0 L -2,-2 Z" fill="#99FF99" opacity="0.9" />
    </g>

    <!-- REUSABLE FIRE (Green) -->
    <g id="greenFire">
      <path d="M 0,0 Q 40,80 60,180 Q 0,280 -60,180 Q -40,80 0,0 Z" fill="url(#flameGreen)" filter="url(#glow)">
        <animateTransform attributeName="transform" type="scale" values="1,1; 1.05,1.2; 0.95,0.9; 1,1" dur="0.1s" repeatCount="indefinite" />
      </path>
      <path d="M 0,20 Q 25,70 35,140 Q 0,200 -35,140 Q -25,70 0,20 Z" fill="#99FF99">
        <animateTransform attributeName="transform" type="scale" values="1,1; 0.9,1.3; 1.1,0.8; 1,1" dur="0.08s" repeatCount="indefinite" />
      </path>
      <path d="M 0,50 Q 15,90 20,120 Q 0,160 -20,120 Q -15,90 0,50 Z" fill="#FFFFFF">
        <animateTransform attributeName="transform" type="scale" values="1,1; 1.2,0.9; 0.8,1.1; 1,1" dur="0.06s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- SIDE BOOSTER (Level 1 Style) -->
    <g id="sideBooster">
      <ellipse cx="0" cy="0" rx="55" ry="110" fill="url(#greenBody)" filter="url(#heavyShadow)" />
      <path d="M -50,-40 L 50,-40 L 55,-10 L -55,-10 Z" fill="url(#gold3D)" />
      <path d="M -40,-70 L 40,-70 L 0,-130 Z" fill="url(#gold3D)" />
      <circle cx="0" cy="20" r="25" fill="url(#gold3D)" filter="url(#heavyShadow)" />
      <circle cx="0" cy="20" r="18" fill="url(#greenGem)" />
      <path d="M -35,100 L 35,100 L 45,130 L -45,130 Z" fill="url(#gold3D)" />
    </g>

    <!-- TIMER RING -->
    <g id="goldenRingGroup">
      <g filter="url(#glow)">
        <circle cx="0" cy="0" r="130" fill="none" stroke="#00CC00" stroke-width="8" opacity="0.6" />
        <circle cx="0" cy="0" r="150" fill="none" stroke="#99FF99" stroke-width="4" opacity="0.9" />
      </g>
      <circle cx="0" cy="0" r="140" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 20" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <path id="textPathYaraam" d="M 380,802 Q 500,832 620,802" />
  </defs>

  <!-- MOVEMENT -->
  <g id="masterMovement">
    <animateTransform attributeName="transform" type="translate" values="0,2000; 0,250; 0,-380; 0,-380; 0,-4000" keyTimes="0; 0.08; 0.842; 0.947; 1" dur="9.5s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1; 0.3 0.3 0.7 0.7; 0 0 1 1; 0.5 0 1 1" />
    
    <g id="rocketShake">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,1; 2,-1; -1,-2; 1,1; 0,0" dur="0.15s" repeatCount="indefinite" end="8s" />
      <animateTransform attributeName="transform" type="translate" values="0,0; -25,15; 30,-15; -15,-25; 25,20; -30,0; 0,0" begin="8s" dur="0.035s" repeatCount="indefinite" end="9s" />
      
      <g transform="translate(500, 700) scale(1.3) translate(-500, -700)">
        
        <circle cx="500" cy="650" r="400" fill="url(#rocketAura)" />

        <!-- ORBS -->
        <g id="floatingWhiteOrbs">
          <circle cx="350" cy="900" r="10" fill="#FFFFFF" filter="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-800" dur="2s" repeatCount="indefinite" begin="0s" /><animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite" begin="0s" /></circle>
          <circle cx="650" cy="950" r="12" fill="#FFFFFF" filter="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-900" dur="2.5s" repeatCount="indefinite" begin="0.3s" /><animate attributeName="opacity" values="0; 0.9; 0" dur="2.5s" repeatCount="indefinite" begin="0.3s" /></circle>
        </g>

        <!-- SPARKS -->
        <g id="sparksGroup">
          <animate attributeName="opacity" to="0" begin="9s" fill="freeze" />
          <use href="#star" x="300" y="550" transform="scale(0.8)" />
          <use href="#star" x="700" y="600" transform="scale(1.2)" />
        </g>
        
        <!-- FLAMES (Only 3 Now) -->
        <g transform="translate(200, 830) scale(1.1)"><use href="#greenFire" /></g>
        <g transform="translate(800, 830) scale(1.1)"><use href="#greenFire" /></g>
        <g transform="translate(500, 930) scale(1.6)"><use href="#greenFire" /></g>

        <!-- BOTTOM FINS -->
        <g transform="translate(500, 860)" filter="url(#heavyShadow)">
          <path d="M -90,-80 Q -140,50 -120,120 Q -80,100 -50,0 Z" fill="url(#goldVertical)" />
          <path d="M 90,-80 Q 140,50 120,120 Q 80,100 50,0 Z" fill="url(#goldVertical)" />
          <path d="M -20,-20 Q 0,100 0,150 Q 0,100 20,-20 Z" fill="#FFE680" />
        </g>

        <!-- ENGINE BASE -->
        <g transform="translate(500, 830)">
          <path d="M -80,0 L 80,0 L 100,60 L -100,60 Z" fill="url(#gold3D)" filter="url(#heavyShadow)" />
          <polygon points="-70,60 70,60 0,110" fill="url(#gold3D)" />
        </g>

        <!-- ENERGY LINES (Only 2) -->
        <g id="missileEnergyLines">
          <ellipse cx="200" cy="550" rx="3" ry="40" fill="#99FF99" filter="url(#glow)"><animate attributeName="ry" values="20; 80; 20" dur="0.9s" repeatCount="indefinite" begin="0.5s" /><animate attributeName="opacity" values="0; 0.8; 0" dur="0.9s" repeatCount="indefinite" begin="0.5s" /><animate attributeName="cy" values="550; 450; 550" dur="0.9s" repeatCount="indefinite" begin="0.5s" /></ellipse>
          <ellipse cx="800" cy="550" rx="3" ry="40" fill="#99FF99" filter="url(#glow)"><animate attributeName="ry" values="20; 80; 20" dur="1.1s" repeatCount="indefinite" begin="0.2s" /><animate attributeName="opacity" values="0; 0.8; 0" dur="1.1s" repeatCount="indefinite" begin="0.2s" /><animate attributeName="cy" values="550; 450; 550" dur="1.1s" repeatCount="indefinite" begin="0.2s" /></ellipse>
        </g>

        <!-- SIMPLE STRUTS FOR 2 MISSILES -->
        <path d="M 360,630 L 200,680 L 200,760 L 380,810 Z" fill="url(#gold3D)" filter="url(#heavyShadow)" />
        <path d="M 640,630 L 800,680 L 800,760 L 620,810 Z" fill="url(#gold3D)" filter="url(#heavyShadow)" />
        
        <!-- 2 SIDE MISSILES -->
        <use href="#sideBooster" x="200" y="720" />
        <use href="#sideBooster" x="800" y="720" />

        <!-- MAIN BODY (Simplified) -->
        <path d="M 370,480 C 300,600 320,800 380,830 L 620,830 C 680,800 700,600 630,480 Q 500,430 370,480 Z" fill="url(#greenBody)" filter="url(#heavyShadow)" />
        <path d="M 365,540 Q 500,580 635,540 L 640,570 Q 500,610 360,570 Z" fill="url(#gold3D)" />
        
        <!-- YARAAN BAND -->
        <path d="M 365,780 Q 500,810 635,780 L 630,820 Q 500,850 370,820 Z" fill="url(#gold3D)" />
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#003300" letter-spacing="4">
          <textPath href="#textPathYaraam" startOffset="50%" text-anchor="middle">YARAAN</textPath>
        </text>

        <!-- NOSE CONE (Basic) -->
        <path d="M 370,480 L 630,480 Q 500,280 500,280 Q 500,280 370,480 Z" fill="url(#gold3D)" filter="url(#heavyShadow)" />
        <path d="M 390,460 L 610,460 Q 500,310 500,310 Q 500,310 390,460 Z" fill="#E6FFE6" />

        <!-- CENTER GEM (Simplified, No Side Wings) -->
        <g transform="translate(500, 630)">
          <circle cx="0" cy="0" r="70" fill="url(#gold3D)" filter="url(#heavyShadow)" />
          <circle cx="0" cy="0" r="50" fill="url(#greenDark)" />
          <circle cx="0" cy="0" r="35" fill="url(#greenGem)" />
        </g>
      </g>
    </g>
  </g>

  <!-- TIMER -->
  <g transform="translate(500, -450) scale(0.65)">
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="0s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="0s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">8</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">8</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="1s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="1s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">7</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">7</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="2s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="2s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">6</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">6</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="3s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="3s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">5</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">5</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="4s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="4s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">4</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">4</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="5s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="5s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">3</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">3</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="6s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="6s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">2</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">2</text></g>
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.1; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="7s" dur="1s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="7s" dur="1s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">1</text><text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">1</text></g>
    
    <g opacity="0" transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0.5; 1.2; 1; 0.5" keyTimes="0; 0.2; 0.8; 1" begin="8s" dur="1.2s" fill="freeze" /><animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" begin="8s" dur="1.2s" fill="freeze" /><use href="#goldenRingGroup" /><text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="120" text-anchor="middle" dominant-baseline="central" fill="#003300" stroke="#001100" stroke-width="15">GO</text><text x="0" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="120" text-anchor="middle" dominant-baseline="central" fill="#99FF99" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)">GO</text></g>
  </g>
</svg>