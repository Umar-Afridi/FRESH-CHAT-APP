<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#EC4899"/><stop offset="100%" stop-color="#BE185D"/></linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0891B2"/></linearGradient>
    <filter id="neon-glow"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <!-- Cyan Hexagon Base Rotating -->
  <polygon points="100,15 173,57 173,142 100,185 27,142 27,57" fill="none" stroke="url(#neon-cyan)" stroke-width="4" filter="url(#neon-glow)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="6s" repeatCount="indefinite"/>
  </polygon>
  <!-- Main Pink Glowing Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#neon-pink)" stroke-width="5" filter="url(#neon-glow)">
    <animate attributeName="stroke-width" values="4; 7; 4" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>