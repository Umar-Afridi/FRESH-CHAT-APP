<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- جادوئی گلو (Glow) ایفیکٹ -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- کلرز (Colors) -->
    <linearGradient id="mainPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <linearGradient id="brightMagenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#f0abfc" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>
  </defs>

  <style>
    /* ہوا میں لہرانے والے سائیڈ ونگز (Wind Sway) - صرف یہ اینیمیشن باقی رکھی ہے */
    @keyframes swayLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }
    @keyframes swayRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }

    .wing-left { animation: swayLeft 3s ease-in-out infinite; transform-origin: 80px 200px; }
    .wing-right { animation: swayRight 3s ease-in-out infinite; transform-origin: 320px 200px; }
  </style>

  <!-- ================== WIND SWAYING WINGS (لہراتے ہوئے پر) ================== -->
  <!-- Left Wing -->
  <g class="wing-left">
    <path d="M 40 190 C 20 130 60 70 120 50 C 90 90 70 140 80 190 Z" fill="url(#brightMagenta)" filter="url(#neonGlow)"/>
    <path d="M 50 260 C 10 310 40 370 100 380 C 60 340 60 290 80 260 Z" fill="url(#mainPurple)"/>
    <path d="M 30 210 C 5 250 15 300 60 340 C 30 290 40 240 60 210 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Right Wing -->
  <g class="wing-right">
    <path d="M 360 190 C 380 130 340 70 280 50 C 310 90 330 140 320 190 Z" fill="url(#brightMagenta)" filter="url(#neonGlow)"/>
    <path d="M 350 260 C 390 310 360 370 300 380 C 340 340 340 290 320 260 Z" fill="url(#mainPurple)"/>
    <path d="M 370 210 C 395 250 385 300 340 340 C 370 290 360 240 340 210 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- ================== MAIN STATIC RING (بالکل سینٹر میں) ================== -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#mainPurple)" stroke-width="26"/>
  <circle cx="200" cy="200" r="132" fill="none" stroke="url(#goldGradient)" stroke-width="6"/>
  <circle cx="200" cy="200" r="158" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>

  <!-- ================== TOP CROWN (تاج) ================== -->
  <g transform="translate(0, 0)">
    <path d="M 140 70 L 160 30 L 200 50 L 240 30 L 260 70 L 200 90 Z" fill="url(#goldGradient)"/>
    <polygon points="200,40 220,65 200,85 180,65" fill="url(#brightMagenta)" filter="url(#neonGlow)"/>
    <circle cx="160" cy="30" r="6" fill="#ffffff"/>
    <circle cx="240" cy="30" r="6" fill="#ffffff"/>
  </g>

  <!-- ================== BOTTOM "YARAAN" BANNER ================== -->
  <g id="bottom-banner" transform="translate(0, 20)">
    <!-- پٹی کا بیک گراؤنڈ -->
    <path d="M 90 320 Q 200 360 310 320 L 325 365 Q 200 410 75 365 Z" fill="url(#mainPurple)" stroke="url(#goldGradient)" stroke-width="4"/>
    <path d="M 60 340 L 90 320 L 75 365 Z" fill="url(#brightMagenta)"/>
    <path d="M 340 340 L 310 320 L 325 365 Z" fill="url(#brightMagenta)"/>
    
    <!-- درمیان کا چھوٹا ہیرا (Gem) -->
    <polygon points="200,385 210,395 200,405 190,395" fill="#fef08a" filter="url(#neonGlow)"/>

    <!-- YARAAN Text -->
    <text x="200" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="5" fill="#3b0764">YARAAN</text>
    <text x="200" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="5" fill="url(#goldGradient)">YARAAN</text>
  </g>

</svg>