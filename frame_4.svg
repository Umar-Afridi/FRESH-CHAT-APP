<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="glow-dia"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <!-- Diamond Sharp Polygon Background -->
  <polygon points="100,10 165,35 190,100 165,165 100,190 35,165 10,100 35,35" fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite"/>
  </polygon>
  <!-- Main Thick Diamond Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#diamond)" stroke-width="5" filter="url(#glow-dia)"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Four Diamond Corners -->
  <g fill="#FFFFFF" filter="url(#glow-dia)">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1.5s" repeatCount="indefinite"/>
    <polygon points="100,16 108,24 100,32 92,24"/>
    <polygon points="100,168 108,176 100,184 92,176"/>
    <polygon points="24,100 32,92 40,100 32,108"/>
    <polygon points="176,100 184,92 176,108 168,100"/>
  </g>
</svg>