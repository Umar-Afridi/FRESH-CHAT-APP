<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dragon-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#064E3B"/><stop offset="50%" stop-color="#10B981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <filter id="drg-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <!-- Dragon Scales Rotating Back -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#dragon-green)" stroke-width="8" stroke-dasharray="15 10" filter="url(#drg-glow)">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <!-- Heavy Gold Inner Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#FDE047" stroke-width="5" filter="url(#drg-glow)"/>
  <!-- Gold Claws -->
  <path d="M 75 24 L 85 40 L 95 24 Z" fill="#F59E0B"><animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="1s" repeatCount="indefinite"/></path>
  <path d="M 105 24 L 115 40 L 125 24 Z" fill="#F59E0B"><animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="1s" repeatCount="indefinite" begin="0.5s"/></path>
  <!-- Green Glowing Eye (Bottom Center) -->
  <polygon points="100,165 110,175 100,185 90,175" fill="#34D399" filter="url(#drg-glow)">
    <animate attributeName="opacity" values="0.5; 1.5; 0.5" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
</svg>