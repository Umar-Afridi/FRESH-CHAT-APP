<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 1. Banner Realistic Gradients -->
        <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#D35400" />
            <stop offset="25%" stop-color="#F39C12" />
            <stop offset="50%" stop-color="#F1C40F" />
            <stop offset="75%" stop-color="#F39C12" />
            <stop offset="100%" stop-color="#E67E22" />
        </linearGradient>

        <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF5A5" />
            <stop offset="50%" stop-color="#F8D347" />
            <stop offset="100%" stop-color="#B9770E" />
        </linearGradient>

        <!-- 2. Checkerboard Pattern for Banner -->
        <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
            <rect width="20" height="20" fill="rgba(255, 255, 255, 0.07)" />
            <rect x="20" y="20" width="20" height="20" fill="rgba(255, 255, 255, 0.07)" />
        </pattern>

        <!-- 3. Realistic Coin Gradients (3D Effect) -->
        <linearGradient id="coinEdge" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F1C40F" />
            <stop offset="30%" stop-color="#B77B05" />
            <stop offset="100%" stop-color="#7D5100" />
        </linearGradient>

        <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF3B0" />
            <stop offset="40%" stop-color="#F1C40F" />
            <stop offset="80%" stop-color="#D4AC0D" />
            <stop offset="100%" stop-color="#9A7D0A" />
        </linearGradient>

        <radialGradient id="coinRim" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
            <stop offset="80%" stop-color="rgba(0,0,0,0)" />
            <stop offset="100%" stop-color="rgba(183, 123, 5, 0.8)" />
        </radialGradient>

        <!-- 4. Play Button Gradient -->
        <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF8DC" />
            <stop offset="50%" stop-color="#FFEAA7" />
            <stop offset="100%" stop-color="#F3C754" />
        </linearGradient>

        <!-- 5. Drop Shadows -->
        <filter id="shadowBanner" x="-5%" y="-10%" width="110%" height="130%">
            <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
        </filter>

        <filter id="shadowCoin">
            <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
        </filter>

        <filter id="shadowBtn">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#9A5000" flood-opacity="0.6"/>
        </filter>

        <!-- 6. Shine Mask -->
        <clipPath id="bannerClip">
            <rect x="50" y="140" width="900" height="120" rx="15" />
        </clipPath>

        <linearGradient id="shineLight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.8)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>

        <!-- 7. The Reusable 3D Coin Object with 'Y' -->
        <g id="coin-y" filter="url(#shadowCoin)">
            <!-- Coin Edge (Thickness) -->
            <path d="M-30,0 L-30,10 A30,13 0 0,0 30,10 L30,0 Z" fill="url(#coinEdge)" />
            <!-- Coin Top Face -->
            <ellipse cx="0" cy="0" rx="30" ry="13" fill="url(#coinFace)" />
            <!-- Inner Rim for Depth -->
            <ellipse cx="0" cy="0" rx="26" ry="11" fill="url(#coinRim)" stroke="#F8C471" stroke-width="1.5"/>
            <!-- 3D Embossed 'Y' -->
            <text x="0" y="3" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="20" fill="#9C640C" text-anchor="middle" dominant-baseline="middle" transform="scale(1, 0.6)">Y</text>
            <text x="0" y="1" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="20" fill="#FFF8DC" text-anchor="middle" dominant-baseline="middle" transform="scale(1, 0.6)">Y</text>
        </g>

        <!-- 8. Sparkle Star Graphic -->
        <path id="star" d="M 0,-12 L 2,-3 L 12,0 L 2,3 L 0,12 L -2,3 L -12,0 L -2,-3 Z" fill="#FFFFFF" filter="drop-shadow(0 0 4px #FFFFFF)"/>
    </defs>

    <style>
        /* CSS Animations */
        @keyframes shineSweep {
            0% { transform: translateX(-200px) skewX(-25deg); }
            100% { transform: translateX(1100px) skewX(-25deg); }
        }
        @keyframes pulseStar {
            0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.4) rotate(45deg); opacity: 1; }
        }
        @keyframes floatCoin {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .shine { animation: shineSweep 3.5s infinite ease-in-out; }
        
        /* Star Delays */
        .st1 { animation: pulseStar 2s infinite ease-in-out; transform-origin: center; }
        .st2 { animation: pulseStar 1.5s infinite ease-in-out 0.4s; transform-origin: center; }
        .st3 { animation: pulseStar 2.2s infinite ease-in-out 0.8s; transform-origin: center; }
        .st4 { animation: pulseStar 1.8s infinite ease-in-out 1.2s; transform-origin: center; }
        .st5 { animation: pulseStar 2.5s infinite ease-in-out 0.2s; transform-origin: center; }
        
        /* Floating animations for realistic stack feel */
        .cn1 { animation: floatCoin 3s infinite ease-in-out; }
        .cn2 { animation: floatCoin 3.5s infinite ease-in-out 0.5s; }
        .cn3 { animation: floatCoin 2.8s infinite ease-in-out 1s; }
    </style>

    <!-- ================== MAIN BANNER (Perfectly Centered Y=140 to 260) ================== -->
    <!-- Banner Border / Outer Glow layer -->
    <rect x="47" y="137" width="906" height="126" rx="18" fill="url(#bannerBorder)" filter="url(#shadowBanner)"/>
    
    <!-- Banner Base Color -->
    <rect x="50" y="140" width="900" height="120" rx="15" fill="url(#bannerBg)" />
    
    <!-- Banner Checkerboard Overly -->
    <rect x="50" y="140" width="900" height="120" rx="15" fill="url(#checker)" />

    <!-- Moving Shine Effect Inside Banner -->
    <g clip-path="url(#bannerClip)">
        <rect class="shine" x="0" y="0" width="120" height="400" fill="url(#shineLight)" />
    </g>

    <!-- ================== SPARKLES (STARS) ================== -->
    <use href="#star" x="90" y="130" class="st1" />
    <use href="#star" x="320" y="245" class="st2" />
    <use href="#star" x="480" y="125" class="st3" />
    <use href="#star" x="880" y="250" class="st4" />
    <use href="#star" x="930" y="140" class="st5" />

    <!-- ================== PLAY BUTTON ================== -->
    <!-- Positioned precisely on the right side, aligned vertically in center of banner -->
    <rect x="750" y="165" width="160" height="70" rx="35" fill="url(#btnGrad)" filter="url(#shadowBtn)"/>
    <text x="830" y="210" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#6A3A00" text-anchor="middle">play</text>


    <!-- ================== REALISTIC 3D COIN STACK (4 -> 3 -> 2 -> 1) ================== -->
    <!-- Positioned near the Play Button, slightly scattered for natural look -->

    <!-- BOTTOM ROW (4 Coins) -->
    <g>
        <use href="#coin-y" x="530" y="215" class="cn1" />
        <use href="#coin-y" x="590" y="225" class="cn2" /> <!-- Thora neechy -->
        <use href="#coin-y" x="650" y="210" class="cn3" /> <!-- Thora oopar -->
        <use href="#coin-y" x="710" y="220" class="cn1" /> <!-- Play button ke sath -->
    </g>

    <!-- SECOND ROW (3 Coins) -->
    <g>
        <use href="#coin-y" x="565" y="185" class="cn3" />
        <use href="#coin-y" x="625" y="175" class="cn1" /> <!-- Randomize -->
        <use href="#coin-y" x="680" y="188" class="cn2" />
    </g>

    <!-- THIRD ROW (2 Coins) -->
    <g>
        <use href="#coin-y" x="595" y="148" class="cn2" />
        <use href="#coin-y" x="655" y="153" class="cn1" />
    </g>

    <!-- TOP ROW (1 Coin) - Pops out above the banner (Y=115, Banner is Y=140) -->
    <g>
        <use href="#coin-y" x="625" y="115" class="cn3" />
    </g>

</svg>