<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="king-gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FEF08A"/><stop offset="30%" stop-color="#B45309"/><stop offset="50%" stop-color="#FDE047"/><stop offset="70%" stop-color="#78350F"/><stop offset="100%" stop-color="#FEF08A"/></linearGradient>
    <filter id="king-glow"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <!-- Massive Background Spinning Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#king-gold)" stroke-width="10" stroke-dasharray="30 20" opacity="0.8" filter="url(#king-glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#king-gold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#king-glow)">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Huge Top Crown (Bouncing) -->
  <g filter="url(#king-glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.5s" repeatCount="indefinite"/>
    <path d="M 60 30 L 70 5 L 85 25 L 100 -5 L 115 25 L 130 5 L 140 30 Q 100 45 60 30 Z" fill="url(#king-gold)"/>
    <circle cx="70" cy="5" r="4" fill="#EF4444"/>
    <circle cx="100" cy="-5" r="5" fill="#EF4444"/>
    <circle cx="130" cy="5" r="4" fill="#EF4444"/>
  </g>
  <!-- King Stars Flying -->
  <g>
    <polygon points="30,150 33,145 36,150 33,155" fill="#FFFFFF" filter="url(#king-glow)"><animate attributeName="cy" values="150; 50" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite"/></polygon>
    <polygon points="170,150 173,145 176,150 173,155" fill="#FFFFFF" filter="url(#king-glow)"><animate attributeName="cy" values="150; 50" dur="2.5s" repeatCount="indefinite" begin="1s"/><animate attributeName="opacity" values="0; 1; 0" dur="2.5s" repeatCount="indefinite" begin="1s"/></polygon>
  </g>
</svg>