<svg viewBox="0 0 420 250" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Neon Green Glow for SVIP2 -->
    <filter id="neonGlowLevel2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Golden Crown Gradient (For SVIP 2) -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff273" />
      <stop offset="30%" stop-color="#ffcc00" />
      <stop offset="70%" stop-color="#d99b00" />
      <stop offset="100%" stop-color="#8c6600" />
    </linearGradient>

    <!-- Moving gradient for the border shine -->
    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff55">
         <animate attributeName="stop-color" values="#00ff55; #00b33c; #00ff55" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#b3ffcc">
         <animate attributeName="stop-color" values="#b3ffcc; #00ff55; #b3ffcc" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff55">
         <animate attributeName="stop-color" values="#00ff55; #00b33c; #00ff55" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="textShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. CHAT BUBBLE BACKGROUND (Stretchable)      -->
  <!-- ========================================== -->
  <g id="BubbleContainer">
    <!-- Deep Dark Green Base -->
    <rect x="60" y="50" width="280" height="120" rx="18" ry="18" fill="#012b0e" />
    
    <!-- Animated Glowing Neon Border -->
    <rect x="60" y="50" width="280" height="120" rx="18" ry="18" fill="none" stroke="url(#borderShine)" stroke-width="5" filter="url(#neonGlowLevel2)">
      <!-- Pulsing Glow Animation -->
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite" />
    </rect>

    <!-- Inner subtle glow line for 3D feel -->
    <rect x="63" y="53" width="274" height="114" rx="15" ry="15" fill="none" stroke="#80ffaa" stroke-width="1.5" opacity="0.5" />
    
    <!-- Chat Text Placeholder -->
    <text x="200" y="125" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)">Hello.</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. WINGS DECORATION (Fixed Top-Left)         -->
  <!-- ========================================== -->
  <g id="TopLeftWings" transform="translate(40, 25)">
    <!-- Base glowing gem/square -->
    <rect x="15" y="15" width="20" height="20" rx="4" fill="#00ff55" filter="url(#neonGlowLevel2)">
      <animate attributeName="opacity" values="0.8; 1; 0.8" dur="1.5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Outer Bright Leaf/Wing -->
    <path d="M 15 15 C -5 25, -10 45, 0 70 C 5 60, 15 45, 25 35 Z" fill="#00ff55" />
    <!-- Inner Leaf/Wing -->
    <path d="M 20 20 C 5 35, 5 60, 10 85 C 20 70, 25 50, 30 35 Z" fill="#b3ffcc" opacity="0.9" />
    <!-- Small side leaf -->
    <path d="M 25 25 C 15 40, 20 65, 30 80 C 35 60, 35 45, 35 30 Z" fill="#00cc44" />
  </g>

  <!-- ========================================== -->
  <!-- 3. GOLDEN CROWN (Fixed Bottom-Right)         -->
  <!-- ========================================== -->
  <g id="BottomRightCrown" transform="translate(290, 120)">
    <!-- Crown Main Body -->
    <path d="M -5 55 L 75 55 L 65 25 L 50 45 L 35 15 L 20 45 L 5 25 Z" fill="url(#goldCrown)" stroke="#ffe680" stroke-width="1.5">
      <!-- Crown gentle levitation/shine tweak -->
      <animate attributeName="opacity" values="0.95; 1; 0.95" dur="3s" repeatCount="indefinite" />
    </path>
    
    <!-- Crown 3D Base -->
    <path d="M -5 55 L 75 55 L 70 68 L 0 68 Z" fill="#b38000" />
    <path d="M 0 68 L 70 68 L 65 73 L 5 73 Z" fill="#664900" />
    
    <!-- Golden Jewels / Ornaments -->
    <circle cx="35" cy="15" r="3.5" fill="#ffffff" filter="url(#neonGlowLevel2)" />
    <circle cx="5" cy="25" r="3" fill="#ffffff" filter="url(#neonGlowLevel2)" />
    <circle cx="65" cy="25" r="3" fill="#ffffff" filter="url(#neonGlowLevel2)" />
    <circle cx="20" cy="45" r="2" fill="#ffcc00" />
    <circle cx="50" cy="45" r="2" fill="#ffcc00" />
  </g>

  <!-- ========================================== -->
  <!-- 4. ANIMATED FLOATING STARS                   -->
  <!-- ========================================== -->
  <g id="Sparkles" fill="#ffffff" filter="url(#neonGlowLevel2)">
    <!-- Left Mid Star -->
    <path d="M 25 110 Q 30 115 40 115 Q 30 115 25 125 Q 25 115 15 115 Q 25 115 25 110 Z">
      <animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="0.8; 1.2; 0.8" dur="2s" repeatCount="indefinite" additive="sum" />
    </path>
    
    <!-- Top Right Big Star -->
    <path d="M 330 30 Q 335 40 350 40 Q 335 40 330 55 Q 325 40 310 40 Q 325 40 330 30 Z">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="0.9; 1.1; 0.9" dur="3s" repeatCount="indefinite" additive="sum" />
    </path>
    
    <!-- Bottom Right Small Star -->
    <path d="M 320 190 Q 323 193 330 193 Q 323 193 320 198 Q 317 193 310 193 Q 317 193 320 190 Z">
      <animate attributeName="opacity" values="0; 1; 0" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>