<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <!-- Silver Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b0b0b0"/>
      <stop offset="75%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Dark Silver Gradient for Borders -->
    <linearGradient id="silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>

    <!-- Gold Gradient for Background Wings -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Teal/Cyan Gradient for Shield -->
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90f0e0"/>
      <stop offset="50%" stop-color="#40d0c0"/>
      <stop offset="100%" stop-color="#1ea090"/>
    </linearGradient>

    <!-- Glow Filter for Diamond -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glow Filter specifically for Text Shine -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Left Wing Component -->
    <g id="left-wing">
      <!-- Gold Feathers -->
      <path d="M 200 250 C 130 200, 50 130, 40 80 C 100 130, 160 180, 200 210 Z" fill="url(#gold-grad)"/>
      <path d="M 200 300 C 110 270, 30 200, 20 140 C 90 200, 150 250, 200 260 Z" fill="url(#gold-grad)"/>
      <path d="M 200 350 C 110 330, 40 280, 30 220 C 100 270, 160 310, 200 310 Z" fill="url(#gold-grad)"/>
      
      <!-- Silver Feathers -->
      <path d="M 190 260 C 120 220, 60 150, 50 100 C 100 160, 150 210, 190 230 Z" fill="url(#silver-grad)"/>
      <path d="M 190 310 C 100 290, 40 220, 30 160 C 80 230, 140 280, 190 280 Z" fill="url(#silver-grad)"/>
      <path d="M 190 360 C 110 350, 50 300, 40 240 C 90 300, 150 330, 190 330 Z" fill="url(#silver-grad)"/>
    </g>
  </defs>

  <!-- Main Group (No up and down floating anymore) -->
  <g>
    <!-- Left Wings with Wind Swaying Animation -->
    <g>
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 200 260; 4 200 260; -1 200 260; 0 200 260" 
        dur="4s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <use href="#left-wing" x="0" y="0" />
    </g>
    
    <!-- Right Wings (Flipped) with Wind Swaying Animation -->
    <g transform="translate(600, 0) scale(-1, 1)">
      <g>
        <animateTransform 
          attributeName="transform" 
          type="rotate" 
          values="0 200 260; -4 200 260; 1 200 260; 0 200 260" 
          dur="4.2s" 
          repeatCount="indefinite" 
          calcMode="spline" 
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <use href="#left-wing" x="0" y="0" />
      </g>
    </g>

    <!-- Main Shield -->
    <g id="shield">
      <path d="M 200 180 L 400 180 L 410 320 Q 410 440 300 500 Q 190 440 190 320 Z" fill="url(#silver-grad)" stroke="url(#silver-dark)" stroke-width="6"/>
      <path d="M 215 195 L 385 195 L 392 315 Q 392 420 300 475 Q 208 420 208 315 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
      <path d="M 220 200 L 380 200 L 385 315 Q 385 410 300 465 Q 215 410 215 315 Z" fill="url(#teal-grad)"/>
    </g>

    <!-- Diamond Center -->
    <g id="diamond" transform="translate(300, 310)">
      <rect x="-55" y="-55" width="110" height="110" transform="rotate(45)" fill="none" stroke="url(#silver-grad)" stroke-width="12" stroke-linejoin="round"/>
      <rect x="-55" y="-55" width="110" height="110" transform="rotate(45)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-35" y="-35" width="70" height="70" transform="rotate(45)" fill="url(#teal-grad)" stroke="url(#silver-grad)" stroke-width="4"/>
      
      <!-- Glowing Core -->
      <circle cx="0" cy="0" r="15" fill="#ffffff" filter="url(#glow)">
        <animate attributeName="r" values="12; 22; 12" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="8" fill="#ffffff" />
    </g>

    <!-- Crown -->
    <g id="crown" transform="translate(0, 20)">
      <path d="M 230 160 L 220 90 L 255 120 L 300 70 L 345 120 L 380 90 L 370 160 Z" fill="url(#silver-grad)" stroke="url(#silver-dark)" stroke-width="2"/>
      <rect x="225" y="150" width="150" height="18" rx="5" fill="url(#silver-grad)" stroke="url(#silver-dark)" stroke-width="2"/>
      
      <circle cx="240" cy="159" r="4" fill="#ffffff"/>
      <circle cx="270" cy="159" r="4" fill="#ffffff"/>
      <circle cx="300" cy="159" r="4" fill="#ffffff"/>
      <circle cx="330" cy="159" r="4" fill="#ffffff"/>
      <circle cx="360" cy="159" r="4" fill="#ffffff"/>
      
      <circle cx="220" cy="85" r="6" fill="url(#silver-grad)"/>
      <circle cx="255" cy="115" r="5" fill="url(#silver-grad)"/>
      <circle cx="300" cy="65" r="8" fill="url(#silver-grad)" filter="url(#glow)"/>
      <circle cx="345" cy="115" r="5" fill="url(#silver-grad)"/>
      <circle cx="380" cy="85" r="6" fill="url(#silver-grad)"/>
    </g>

    <!-- Banner / Ribbon at Bottom -->
    <g id="banner" transform="translate(0, 440)">
      <!-- Ribbon Back Folds -->
      <path d="M 180 0 L 140 -20 L 160 30 L 130 60 L 200 40 Z" fill="url(#silver-dark)"/>
      <path d="M 420 0 L 460 -20 L 440 30 L 470 60 L 400 40 Z" fill="url(#silver-dark)"/>
      
      <!-- Main Front Ribbon -->
      <path d="M 180 0 Q 300 40 420 0 L 400 50 Q 300 90 200 50 Z" fill="url(#silver-grad)" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Text Shadow (Perfectly Centered Vertically at y=59 for Shadow) -->
      <text x="300" y="59" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#606060" text-anchor="middle" letter-spacing="3">SVIP 1</text>
      
      <!-- Solid White Main Text (Centered at y=57) -->
      <text x="300" y="57" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SVIP 1</text>
      
      <!-- Shiny Glowing Text Layer (Animated Shine Effect) -->
      <text x="300" y="57" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#90f0e0" filter="url(#text-glow)" text-anchor="middle" letter-spacing="3">
        <animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite" />
        SVIP 1
      </text>
    </g>
  </g>
</svg>