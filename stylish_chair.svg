<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- کرسی کی پشت کا کلر (Backrest) -->
    <linearGradient id="backGrad" x1="0" y1="20" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dd0000"/>
      <stop offset="60%" stop-color="#800000"/>
      <stop offset="100%" stop-color="#2a0000"/>
    </linearGradient>

    <!-- 🔥 بائیں بازو کا کلر (یہاں کمال کیا گیا ہے) 🔥 -->
    <!-- باہر سے روشن اور اندر کی طرف جا کر بالکل ڈارک ہو جائے گا تاکہ کرسی کے ساتھ جڑا ہوا لگے -->
    <linearGradient id="leftArmGrad" x1="20" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6666"/>   <!-- باہر سے چمکدار -->
      <stop offset="20%" stop-color="#cc0000"/>  <!-- درمیان سے سرخ -->
      <stop offset="85%" stop-color="#660000"/>  <!-- اندر سے گہرا سرخ -->
      <stop offset="100%" stop-color="#150000"/> <!-- بالکل اندر سے بلیک شیڈو (Crease) -->
    </linearGradient>

    <!-- 🔥 دائیں بازو کا کلر (Left کا الٹ) 🔥 -->
    <linearGradient id="rightArmGrad" x1="300" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#150000"/>   <!-- بالکل اندر سے بلیک شیڈو (Crease) -->
      <stop offset="15%" stop-color="#660000"/>  <!-- اندر سے گہرا سرخ -->
      <stop offset="80%" stop-color="#cc0000"/>  <!-- درمیان سے سرخ -->
      <stop offset="100%" stop-color="#ff6666"/> <!-- باہر سے چمکدار -->
    </linearGradient>

    <!-- بیٹھنے والی جگہ کا گہرا سایہ (Seat Base Depth) -->
    <linearGradient id="seatTopGrad" x1="0" y1="240" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110000"/>
      <stop offset="100%" stop-color="#590000"/>
    </linearGradient>

    <!-- سامنے والا موٹا کشن (Front Thick Base) -->
    <linearGradient id="frontBaseGrad" x1="0" y1="260" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8080"/> <!-- اوپر سے چمکدار کنارہ -->
      <stop offset="15%" stop-color="#cc0000"/>
      <stop offset="70%" stop-color="#660000"/>
      <stop offset="100%" stop-color="#150000"/>
    </linearGradient>

    <!-- پورے صوفے کے نیچے کا شیڈو -->
    <filter id="bottomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- کرسی کی مین پشت (Backrest - یہ بازوؤں کے پیچھے جائے گی) -->
  <!-- چوڑائی تھوڑی زیادہ کی ہے تاکہ بازو اس کے اندر فٹ لگیں -->
  <path d="M 80 20 L 320 20 C 350 20 350 60 350 100 L 350 280 L 50 280 L 50 100 C 50 60 50 20 80 20 Z" fill="url(#backGrad)" />

  <!-- بیٹھنے والی جگہ (Seat Area - Dark Shadow) -->
  <path d="M 60 230 L 340 230 L 360 280 L 40 280 Z" fill="url(#seatTopGrad)" />

  <!-- ================= لیفٹ بازو (Left Armrest) ================= -->
  <!-- اندر سے ڈارک شیڈو کی وجہ سے یہ اب کٹا ہوا محسوس نہیں ہوگا -->
  <rect x="20" y="125" width="80" height="155" rx="40" fill="url(#leftArmGrad)" />
  <!-- بائیں بازو پر گول شائننگ لائن -->
  <path d="M 30 165 Q 60 120 90 165" stroke="#ffb3b3" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ================= رائٹ بازو (Right Armrest) ================= -->
  <rect x="300" y="125" width="80" height="155" rx="40" fill="url(#rightArmGrad)" />
  <!-- دائیں بازو پر گول شائننگ لائن -->
  <path d="M 310 165 Q 340 120 370 165" stroke="#ffb3b3" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ================= نیچے والا موٹا کشن (Front Base) ================= -->
  <!-- یہ کشن بازوؤں کے نچلے حصے کو کور کر لے گا تاکہ وہ ایک ہی صوفے کا حصہ لگیں -->
  <rect x="15" y="260" width="370" height="80" rx="40" fill="url(#frontBaseGrad)" filter="url(#bottomShadow)" />
  
  <!-- سامنے والے کشن پر ہلکی سی 3D شائننگ لائن -->
  <path d="M 50 268 L 350 268" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>

</svg>